[package]
name = "wpai-desktop"
version = "1.3.4"
description = "WPAI WhatsApp ve AI yönetim paneli Windows istemcisi"
authors = ["WPAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wpai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.3"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "3.6.3", features = ["windows-native"] }
