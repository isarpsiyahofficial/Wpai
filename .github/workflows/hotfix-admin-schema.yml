name: WPAI Admin Schema Hotfix

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/hotfix-admin-schema.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch-verify-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact legacy admins schema repair
        shell: python
        run: |
          from pathlib import Path

          bootstrap = Path('desktop-bootstrap/bootstrap.mjs')
          text = bootstrap.read_text(encoding='utf-8')

          anchor = """async function workerRequest(route, init = {}) {"""
          helper = """function sqliteErrorIncludes(error, needle) {
            return safeError(error).toLowerCase().includes(needle.toLowerCase());
          }

          async function ensureAdminSoftDeleteColumn(token) {
            try {
              await d1Query(token, 'SELECT deleted_at FROM admins LIMIT 0');
              return { repaired: false };
            } catch (error) {
              if (!sqliteErrorIncludes(error, 'no such column: deleted_at')) throw error;
            }

            try {
              await d1Query(token, 'ALTER TABLE admins ADD COLUMN deleted_at TEXT');
            } catch (error) {
              if (!sqliteErrorIncludes(error, 'duplicate column name: deleted_at')) {
                throw new Error(`Yönetici tablo şeması onarılamadı. ${safeError(error)}`);
              }
            }

            await d1Query(token, 'SELECT deleted_at FROM admins LIMIT 0');
            return { repaired: true };
          }

          async function workerRequest(route, init = {}) {"""
          if helper not in text:
            if text.count(anchor) != 1:
              raise SystemExit('workerRequest insertion anchor not found exactly once')
            text = text.replace(anchor, helper, 1)

          old_count = """async function activeOwnerCount(token) {
            let entries;
            try {
              entries = await d1Query(token, \"SELECT COUNT(*) AS total FROM admins WHERE role='owner' AND status='active' AND deleted_at IS NULL\");
            } catch (error) {
              throw new Error(`Yönetici tablosu okunamadı. Production migrationları eksik olabilir veya tokenin D1 Read izni yoktur. ${safeError(error)}`);
            }
            return Number(entries[0]?.results?.[0]?.total ?? 0);
          }"""
          new_count = """async function activeOwnerCount(token) {
            let entries;
            try {
              await ensureAdminSoftDeleteColumn(token);
              entries = await d1Query(token, \"SELECT COUNT(*) AS total FROM admins WHERE role='owner' AND status='active' AND deleted_at IS NULL\");
            } catch (error) {
              throw new Error(`Yönetici tablosu okunamadı. ${safeError(error)}`);
            }
            return Number(entries[0]?.results?.[0]?.total ?? 0);
          }"""
          if old_count in text:
            text = text.replace(old_count, new_count, 1)
          elif new_count not in text:
            raise SystemExit('activeOwnerCount block did not match expected source')

          text = text.replace("appVersion: '1.3.5'", "appVersion: '1.3.6'")
          bootstrap.write_text(text, encoding='utf-8')

          test_file = Path('desktop-bootstrap/bootstrap.test.mjs')
          tests = test_file.read_text(encoding='utf-8')
          marker = "legacy admins table missing deleted_at is repaired automatically"
          if marker not in tests:
            tests += r'''

test('legacy admins table missing deleted_at is repaired automatically without blaming token permissions', async () => {
  let repaired = false;
  let probeCount = 0;
  await withServer((request, response) => {
    response.setHeader('Content-Type', 'application/json');
    if (request.url === '/user/tokens/verify') return response.end(cloudflareSuccess({ status: 'active' }));
    if (request.url === `/accounts/${ACCOUNT_ID}/d1/database/${D1_ID}`) return response.end(cloudflareSuccess({ uuid: D1_ID, name: 'wa-ai-prod' }));
    if (request.url === '/health') return response.end(JSON.stringify({ ok: true, components: { worker: true, d1: true } }));
    if (request.url === `/accounts/${ACCOUNT_ID}/d1/database/${D1_ID}/query`) {
      let raw = '';
      request.on('data', chunk => { raw += chunk; });
      return request.on('end', () => {
        const body = JSON.parse(raw);
        if (body.sql === 'SELECT deleted_at FROM admins LIMIT 0') {
          probeCount += 1;
          if (!repaired) {
            response.statusCode = 400;
            return response.end(JSON.stringify({ success: false, errors: [{ code: 7500, message: 'no such column: deleted_at at offset 7: SQLITE_ERROR' }] }));
          }
          return response.end(cloudflareSuccess([{ success: true, results: [], meta: { changes: 0 } }]));
        }
        if (body.sql === 'ALTER TABLE admins ADD COLUMN deleted_at TEXT') {
          repaired = true;
          return response.end(cloudflareSuccess([{ success: true, results: [], meta: { changes: 0 } }]));
        }
        const results = body.sql.includes('COUNT(*)') ? [{ total: 0 }] : [];
        return response.end(cloudflareSuccess([{ success: true, results, meta: { changes: body.sql.includes('INSERT INTO admins') ? 1 : 0 } }]));
      });
    }
    if (request.url === '/api/auth/desktop/login') return response.end(apiSuccess({
      admin: { id: 'admin-1', name: 'İbrahim', email: 'isarpsiyah@gmail.com', role: 'owner' },
      accessToken: 'a'.repeat(64), refreshToken: 'r'.repeat(64)
    }));
    if (request.url === '/api/auth/desktop/logout') return response.end(apiSuccess({ loggedOut: true }));
    response.statusCode = 404;
    response.end('{}');
  }, async baseUrl => {
    const result = await runBootstrap(baseUrl, setupPayload());
    assert.equal(result.code, 0, result.stderr);
    assert.equal(result.body.ok, true);
    assert.equal(repaired, true);
    assert.equal(probeCount, 2);
    assert.equal(JSON.stringify(result.body).includes('D1 Read izni yoktur'), false);
  });
});
'''
            test_file.write_text(tests, encoding='utf-8')

          for filename in ['package.json', 'package-lock.json', 'src-tauri/tauri.conf.json']:
            path = Path(filename)
            value = path.read_text(encoding='utf-8')
            value = value.replace('1.3.5', '1.3.6')
            path.write_text(value, encoding='utf-8')

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run full application quality gate
        run: npm run check
      - name: Remove temporary hotfix workflow and commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/hotfix-admin-schema.yml
          git config user.name 'WPAI Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add desktop-bootstrap/bootstrap.mjs desktop-bootstrap/bootstrap.test.mjs package.json package-lock.json src-tauri/tauri.conf.json
          git commit -m 'fix: repair legacy D1 admin schema before owner lookup'
          git push origin HEAD:agent/wpai-production-rebuild
      - name: Trigger canonical Windows installer validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run windows-desktop.yml --ref agent/wpai-production-rebuild
