name: Apply one-shot runtime fixes

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths: [.runtime-fix-trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - name: Apply verified source replacements
        shell: python
        run: |
          from pathlib import Path

          extended = Path('src/worker/extendedApi.ts')
          text = extended.read_text('utf-8')
          old = "alreadyRegistered: existing.size, optOutExcluded: optedOut.size"
          new = "alreadyRegistered: [...existing].filter(phone => !optedOut.has(phone)).length, optOutExcluded: optedOut.size"
          if text.count(old) != 1:
              raise SystemExit('CSV replacement target not found exactly once')
          extended.write_text(text.replace(old, new), 'utf-8')

          webhook = Path('src/worker/webhook.ts')
          text = webhook.read_text('utf-8')
          old = "INSERT INTO webhook_events (id, payload_hash, event_type, status, received_at) VALUES (?, ?, 'whatsapp', 'received', ?)`, eventId, payloadHash, nowIso()"
          new = "INSERT INTO webhook_events (id, provider_event_id, payload_hash, event_type, status, received_at) VALUES (?, ?, ?, 'whatsapp', 'received', ?)`, eventId, payloadHash, payloadHash, nowIso()"
          if text.count(old) != 1:
              raise SystemExit('Webhook replacement target not found exactly once')
          webhook.write_text(text.replace(old, new), 'utf-8')
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .runtime-fix-trigger .github/workflows/one-shot-runtime-fixes.yml
          git config user.name "WPAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: separate CSV opt-outs and enforce webhook idempotency"
          git push origin HEAD:agent/wpai-production-rebuild
