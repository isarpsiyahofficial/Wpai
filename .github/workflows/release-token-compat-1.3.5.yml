name: Release Token Compatibility 1.3.5

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - 'scripts/release_token_compat_1_3_5.py'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply user and account token compatibility
        run: python scripts/release_token_compat_1_3_5.py
      - name: Verify full application gates
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit verified 1.3.5 source
        run: |
          rm -f scripts/release_token_compat_1_3_5.py .github/workflows/release-token-compat-1.3.5.yml
          git config user.name 'WPAI Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: WPAI 1.3.5 token compatibility'
          git push origin HEAD:agent/wpai-production-rebuild
