name: WPAI Quality Gates

on:
  push:
    branches: [main, agent/wpai-production-rebuild]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: wpai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-current-head:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/wpai-production-rebuild'
    name: Verified current-head repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply deterministic corrections and restore workflow
        shell: python
        run: |
          from pathlib import Path

          operations = Path('src/worker/operationsApi.ts')
          value = operations.read_text('utf-8')
          replacements = {
              "new TextDecoder('utf-8', { fatal: false })": "new TextDecoder('utf-8', { fatal: false, ignoreBOM: false })",
              "VALUES (?,?,?,'admin',?,?,?,?,?)": "VALUES (?,?,?,'admin',?,?,?,?)",
          }
          for old, new in replacements.items():
              if old not in value:
                  raise SystemExit(f'operationsApi expected source missing: {old}')
              value = value.replace(old, new, 1)
          operations.write_text(value, 'utf-8')

          training = Path('src/worker/trainingApi.ts')
          value = training.read_text('utf-8')
          old = "  const checksum = await itemChecksum(input);"
          new = """  const checksum = await itemChecksum({
            itemType: input.itemType,
            title: input.title,
            content: input.content,
            expectedResponse: input.expectedResponse ?? null,
            usagePermission: input.usagePermission,
            scope: input.scope,
            contactId: input.contactId ?? null,
            conversationId: input.conversationId ?? null,
            priority: input.priority,
            validFrom: input.validFrom ?? null,
            validUntil: input.validUntil ?? null
          });"""
          if old not in value:
              raise SystemExit('training item checksum source missing')
          value = value.replace(old, new, 1)
          old = "{ conversionOptions: { output: { format: 'markdown' }, pdf: { metadata: false } } }"
          new = "{ conversionOptions: { pdf: { metadata: false } } }"
          if old not in value:
              raise SystemExit('toMarkdown options source missing')
          value = value.replace(old, new, 1)
          old = "    const itemChecksum = await itemChecksum({"
          if old not in value:
              raise SystemExit('training checksum shadow source missing')
          value = value.replace(old, "    const draftChecksum = await itemChecksum({", 1)
          old = ").bind(itemId, threadId, title, extracted, itemChecksum, c.get('adminId')!, finished, finished)"
          if old not in value:
              raise SystemExit('training draft checksum bind source missing')
          value = value.replace(old, ").bind(itemId, threadId, title, extracted, draftChecksum, c.get('adminId')!, finished, finished)", 1)
          training.write_text(value, 'utf-8')

          one_shot = Path('.github/workflows/one-shot-current-fixes.yml')
          if one_shot.exists():
              one_shot.unlink()

          Path('.github/workflows/ci.yml').write_text('''name: WPAI Quality Gates

on:
  push:
    branches: [main, agent/wpai-production-rebuild]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wpai-ci-${{ github.ref }}
