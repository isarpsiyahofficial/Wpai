name: WPAI Quality Gates

on:
  push:
    branches: [main, agent/wpai-production-rebuild]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: wpai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verified-faiss-ipc-fix:
    name: Verify and apply Windows-safe FAISS IPC
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/wpai-production-rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt
      - name: Apply encoding-only corrections
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('sidecar/faiss_service.py')
          value = service.read_text('utf-8')
          old = 'sys.stdout.write(json.dumps(value, ensure_ascii=False, separators=(",", ":")))'
          new = 'sys.stdout.write(json.dumps(value, ensure_ascii=True, separators=(",", ":")))'
          if value.count(old) != 1:
              raise SystemExit(f'Expected one FAISS IPC serializer, found {value.count(old)}')
          service.write_text(value.replace(old, new, 1), 'utf-8')

          tests = Path('sidecar/test_faiss_service.py')
          value = tests.read_text('utf-8')
          first = 'subprocess.run([sys.executable, str(SCRIPT), *args], check=True, capture_output=True, text=True)'
          second = 'subprocess.run([sys.executable, str(SCRIPT), *args], capture_output=True, text=True)'
          if value.count(first) != 1 or value.count(second) != 1:
              raise SystemExit('Expected FAISS subprocess helpers were not found exactly once.')
          value = value.replace(first, 'subprocess.run([sys.executable, str(SCRIPT), *args], check=True, capture_output=True, text=True, encoding="utf-8")', 1)
          value = value.replace(second, 'subprocess.run([sys.executable, str(SCRIPT), *args], capture_output=True, text=True, encoding="utf-8")', 1)
          tests.write_text(value, 'utf-8')
          PY
          grep -q 'text-index.faiss' sidecar/faiss_service.py
          grep -q 'TEXT_INDEX_REBUILD_REQUIRED' sidecar/faiss_service.py
      - run: python -m pip install --upgrade pip
      - run: pip install -r sidecar/requirements.txt
      - run: npm ci --no-audit --no-fund
      - name: Run every product gate before committing
        run: |
          set -euo pipefail
          python -m compileall -q scripts sidecar
          python -m pytest -q sidecar/test_faiss_service.py
          npm run security:scan
          npm run validate
          npm run typecheck
          npm run test
          npm run build
          npm run deploy:dry
      - name: Commit verified IPC correction
        run: |
          set -euo pipefail
          git config user.name 'WPAI Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add sidecar/faiss_service.py sidecar/test_faiss_service.py
          git diff --cached --check
          git commit -m 'fix Windows FAISS IPC encoding without changing the text index'
          git push origin HEAD:agent/wpai-production-rebuild

  application:
    name: Application, Worker and D1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Secret scan
        run: npm run security:scan
      - name: Validate manifest, migrations and product scope
        run: npm run validate
      - name: Strict frontend, Worker and test TypeScript
        run: npm run typecheck
      - name: Node unit tests
        run: npm run test:unit
      - name: Workerd integration tests
        run: npm run test:worker
      - name: React production build
        run: npm run build
      - name: Wrangler production dry-run
        run: npm run deploy:dry
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: wpai-web-${{ github.sha }}
          path: dist/web
          if-no-files-found: error
          retention-days: 14
      - name: Create clean source audit archive
        run: |
          set -euo pipefail
          git archive --format=zip --output=wpai-source-audit.zip HEAD
          sha256sum wpai-source-audit.zip > wpai-source-audit.zip.sha256
      - name: Upload clean source audit archive
        uses: actions/upload-artifact@v4
        with:
          name: wpai-source-audit-${{ github.sha }}
          path: |
            wpai-source-audit.zip
            wpai-source-audit.zip.sha256
          if-no-files-found: error
          retention-days: 3

  faiss-linux:
    name: FAISS sidecar tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r sidecar/requirements.txt
      - run: python -m pytest -q sidecar/test_faiss_service.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --audit-level=high
