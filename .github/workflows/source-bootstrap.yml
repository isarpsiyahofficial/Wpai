name: Expand WPAI source archive

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths: [.source-bootstrap/manifest.json]

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(python -c "import json; print(json.load(open('.source-bootstrap/manifest.json'))['sha256'])")
          cat .source-bootstrap/payload.part* | base64 --decode > /tmp/wpai-source.tar.gz
          echo "$EXPECTED  /tmp/wpai-source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/wpai-source
          tar -xzf /tmp/wpai-source.tar.gz -C /tmp/wpai-source
      - name: Replace transfer payload with source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .source-bootstrap .github/workflows/bootstrap-source.yml
          cp -a /tmp/wpai-source/. .
          git config user.name "WPAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: build complete WPAI platform"
          git push origin HEAD:agent/wpai-production-rebuild
