name: WPAI One-shot Current Fixes

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/one-shot-current-fixes.yml'

permissions:
  contents: write

concurrency:
  group: wpai-one-shot-current-fixes
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact source corrections
        shell: python
        run: |
          from pathlib import Path

          operations = Path('src/worker/operationsApi.ts')
          text = operations.read_text('utf-8')
          replacements = {
              "new TextDecoder('utf-8', { fatal: false })": "new TextDecoder('utf-8', { fatal: false, ignoreBOM: false })",
              "VALUES (?,?,?,'admin',?,?,?,?,?)": "VALUES (?,?,?,'admin',?,?,?,?)",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'operations replacement missing: {old}')
              text = text.replace(old, new, 1)
          operations.write_text(text, 'utf-8')

          training = Path('src/worker/trainingApi.ts')
          text = training.read_text('utf-8')
          old_checksum = "  const checksum = await itemChecksum(input);"
          new_checksum = """  const checksum = await itemChecksum({
            itemType: input.itemType,
            title: input.title,
            content: input.content,
            expectedResponse: input.expectedResponse ?? null,
            usagePermission: input.usagePermission,
            scope: input.scope,
            contactId: input.contactId ?? null,
            conversationId: input.conversationId ?? null,
            priority: input.priority,
            validFrom: input.validFrom ?? null,
            validUntil: input.validUntil ?? null
          });"""
          if old_checksum not in text:
              raise SystemExit('training item checksum replacement missing')
          text = text.replace(old_checksum, new_checksum, 1)

          old_options = "{ conversionOptions: { output: { format: 'markdown' }, pdf: { metadata: false } } }"
          new_options = "{ conversionOptions: { pdf: { metadata: false } } }"
          if old_options not in text:
              raise SystemExit('toMarkdown options replacement missing')
          text = text.replace(old_options, new_options, 1)

          old_shadow = "    const itemChecksum = await itemChecksum({"
          if old_shadow not in text:
              raise SystemExit('checksum shadow replacement missing')
          text = text.replace(old_shadow, "    const draftChecksum = await itemChecksum({", 1)
          marker = "      ).bind(itemId, threadId, title, extracted, itemChecksum, c.get('adminId')!, finished, finished)"
          if marker not in text:
              raise SystemExit('draft checksum bind replacement missing')
          text = text.replace(marker, "      ).bind(itemId, threadId, title, extracted, draftChecksum, c.get('adminId')!, finished, finished)", 1)
          training.write_text(text, 'utf-8')

          validator = Path('scripts/validate.py')
          v = validator.read_text('utf-8')
          if '"src/worker/operationsApi.ts"' not in v:
              v = v.replace('"src/worker/trainingApi.ts", "src/worker/deadLetter.ts",', '"src/worker/trainingApi.ts", "src/worker/operationsApi.ts", "src/worker/deadLetter.ts",')
          validator.write_text(v, 'utf-8')

          Path('.github/workflows/one-shot-current-fixes.yml').unlink()
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate migrations and manifest
        run: npm run validate
      - name: Strict TypeScript
        run: npm run typecheck
      - name: Commit verified corrections and remove workflow
        shell: bash
        run: |
          git config user.name "wpai-ci"
          git config user.email "wpai-ci@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve training and operations type errors"
          git push origin HEAD:agent/wpai-production-rebuild

# Triggered after the training interface and operations API were mounted.
