name: Apply completion patch

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths: [.completion-patch-trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - name: Apply verified product patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(file: str, old: str, new: str) -> None:
              path = Path(file)
              text = path.read_text('utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{file}: replacement target count={count}, expected=1')
              path.write_text(text.replace(old, new), 'utf-8')

          # Exact optional typing without weakening strict mode.
          replace_once(
              'src/worker/ai.ts',
              "conversationId?: string; success: boolean; errorCode?: string; durationMs: number;",
              "conversationId?: string | undefined; success: boolean; errorCode?: string | undefined; durationMs: number;"
          )

          # Use the current officially priced/available model ID.
          for file in ('wrangler.jsonc', 'scripts/validate.py'):
              replace_once(file, '@cf/meta/llama-3.1-8b-instruct-fast', '@cf/meta/llama-3.1-8b-instruct-fp8-fast')
          replace_once(
              'tests/unit/ai-claims.test.ts',
              "@cf/meta/llama-3.1-8b-instruct-fast",
              "@cf/meta/llama-3.1-8b-instruct-fp8-fast"
          )

          # Persist safe requirement updates, versioned summaries and blocked critical claims.
          replace_once(
              'src/worker/queues.ts',
              "import { first, nowIso, run, setting } from './db';",
              "import { all, first, nowIso, run, setting } from './db';"
          )
          old_queue = """      for (const note of decision.note_updates) {
        await run(env.DB, `INSERT INTO customer_notes (id, contact_id, conversation_id, source, note_text, created_at, updated_at) VALUES (?, ?, ?, 'ai', ?, ?, ?)`, crypto.randomUUID(), job.contactId, job.conversationId, note.text, nowIso(), nowIso());
      }
      if (decision.needs_human || decision.action === 'handoff') await createHandoff(env, job, decisionId, decision.intent, source.text_content);
      const gate = await finalSendGate(env, job, decision);
      if (gate.allowed && decision.reply.trim()) {
"""
