name: WPAI One-shot Responsive Contracts

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/one-shot-responsive-contracts.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair populated browser contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/responsive.spec.mjs')
          text = path.read_text('utf-8')

          old_pages = "  ['ai', 'AI Kontrolü'],\n  ['notifications', 'Bildirimler'],"
          new_pages = "  ['ai', 'AI Kontrolü'],\n  ['training', 'AI Eğitim Merkezi'],\n  ['notifications', 'Bildirimler'],"
          if text.count(old_pages) != 1:
              raise SystemExit('PAGES_INSERTION_POINT_NOT_UNIQUE')
          text = text.replace(old_pages, new_pages)

          old_get = "      'GET /api/meta/status': { configured: true, status: 'configured', verifiedAt: NOW, phoneNumberIdMasked: '***4567' },\n      'GET /api/settings': { aiModel: '@cf/meta/llama-3.1-8b-instruct-fp8-fast', embeddingModel: '@cf/baai/bge-m3', timezone: 'Europe/Istanbul' }"
          new_get = "      'GET /api/meta/status': { configured: true, status: 'configured', verifiedAt: NOW, phoneNumberIdMasked: '***4567' },\n      'GET /api/settings': { aiModel: '@cf/meta/llama-3.1-8b-instruct-fp8-fast', embeddingModel: '@cf/baai/bge-m3', timezone: 'Europe/Istanbul' },\n      'GET /api/branding': { app_name: 'WPAI Yönetim Paneli', company_name: LONG_NAME, short_description: LONG_TEXT, logo_key: null, primary_color: '#7657ff', secondary_color: '#22c7e8', updated_at: NOW },\n      'GET /api/canned-replies': [{ id: 'reply-1', title: 'Kurumsal paket açıklaması', body: LONG_TEXT, status: 'active', updated_at: NOW }],\n      'GET /api/dead-letters': [{ id: 'dead-letter-1', source_queue: 'wa-outbound', payload_json: JSON.stringify({ messageId: 'message-1', secret: '[REDACTED]' }), error_code: 'META_TEMPORARY_ERROR', status: 'pending', attempts: 4, failed_at: NOW, retried_at: null, resolved_at: null }],\n      'GET /api/training/overview': { sessions: [], items: [], sources: [], jobs: [], index: { indexName: 'wa-ai-knowledge-prod', embeddingModel: '@cf/baai/bge-m3', dimensions: 1024, metric: 'cosine', activeChunks: 14, pendingJobs: 0, failedJobs: 0 } }"
          if text.count(old_get) != 1:
              raise SystemExit('GET_CONTRACT_INSERTION_POINT_NOT_UNIQUE')
          text = text.replace(old_get, new_get)

          old_label = "await page.getByLabel('API Token').fill('test-cloudflare-api-token-that-is-long-enough-for-live-like-check');"
          new_label = "await page.getByLabel('Sınırlı Cloudflare API Token', { exact: true }).fill('test-cloudflare-api-token-that-is-long-enough-for-live-like-check');"
          if text.count(old_label) != 1:
              raise SystemExit('TOKEN_LABEL_INSERTION_POINT_NOT_UNIQUE')
          text = text.replace(old_label, new_label)

          path.write_text(text, 'utf-8')
          PY
      - name: Verify strict source and browser test syntax
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          node --check tests/e2e/responsive.spec.mjs
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/one-shot-responsive-contracts.yml
          git config user.name 'WPAI Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tests/e2e/responsive.spec.mjs .github/workflows/one-shot-responsive-contracts.yml
          git commit -m 'Repair responsive contracts and cover training page'
          git push origin HEAD:agent/wpai-production-rebuild
