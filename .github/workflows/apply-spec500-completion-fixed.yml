name: Apply WPAI 500 Item Completion Fixed

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-spec500-completion-fixed.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/wpai-production-rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Reassemble verified product patches
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/spec500-patch/part-00 scripts/spec500-patch/part-01 scripts/spec500-patch/part-02 scripts/spec500-patch/part-03a scripts/spec500-patch/part-03b scripts/spec500-patch/part-04 > /tmp/spec500-completion.patch.gz.b64
          echo '82d1aeb192f3ec59a7b218baf55c517a9b2c2b7c992775e53167a719c0b73b8e  /tmp/spec500-completion.patch.gz.b64' | sha256sum --check

          cat scripts/spec500-patch/new-000 scripts/spec500-patch/new-001 scripts/spec500-patch/new-010 scripts/spec500-patch/new-011 scripts/spec500-patch/new-02 scripts/spec500-patch/new-03 scripts/spec500-patch/new-04 scripts/spec500-patch/new-05 > /tmp/spec500-new-files.patch.gz.b64
          echo 'fc2077841568bdb0c2d2cb1b07bf1135fbd63ee99b39984d042a65787bcb3694  /tmp/spec500-new-files.patch.gz.b64' | sha256sum --check

          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          for encoded_path, output_path in (
              ('/tmp/spec500-completion.patch.gz.b64', '/tmp/spec500-completion.patch'),
              ('/tmp/spec500-new-files.patch.gz.b64', '/tmp/spec500-new-files.patch'),
          ):
              encoded = Path(encoded_path).read_bytes()
              decoded = base64.b64decode(encoded, validate=True)
              Path(output_path).write_bytes(gzip.decompress(decoded))
          PY

          echo '6d241cca3f272bc703716f91fa496a5217239d910505d3c8021dd72690c1ba1b  /tmp/spec500-completion.patch' | sha256sum --check
          echo 'e3d19758a39e4bdfc37a0cfd45133af179e7bd52372d50b61907b6d5a8ce64f1  /tmp/spec500-new-files.patch' | sha256sum --check
          git apply --check /tmp/spec500-completion.patch
          git apply /tmp/spec500-completion.patch
          git apply --check /tmp/spec500-new-files.patch
          git apply /tmp/spec500-new-files.patch

      - name: Apply deterministic compile and fixture corrections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          webhook = Path('src/worker/webhook.ts')
          value = webhook.read_text('utf-8')
          old = "  const metadata = await metadataResponse.json<{ url?: string; mime_type?: string; file_size?: number }>().catch(() => ({}));"
          new = "  const metadata = await metadataResponse.json<{ url?: string; mime_type?: string; file_size?: number }>()\n    .catch((): { url?: string; mime_type?: string; file_size?: number } => ({}));"
          if value.count(old) != 1:
              raise SystemExit(f'Expected exactly one Meta metadata expression, found {value.count(old)}')
          webhook.write_text(value.replace(old, new, 1), 'utf-8')

          fixture = Path('tests/worker/training-vector.test.ts')
          value = fixture.read_text('utf-8')
          old = "VALUES (?,?,?,'ready',?,?,?,?)"
          new = "VALUES (?,?,?,'approved',?,?,?,?)"
          if value.count(old) != 1:
              raise SystemExit(f'Expected exactly one invalid knowledge source fixture, found {value.count(old)}')
          fixture.write_text(value.replace(old, new, 1), 'utf-8')

          readme = Path('README.md')
          readme.write_text(readme.read_text('utf-8').rstrip() + '\n', 'utf-8')
          PY
          rm -rf scripts/spec500-patch

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install FAISS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt

      - name: Run all static and runtime gates
        run: |
          set -euo pipefail
          python -m compileall -q scripts sidecar
          python -m pytest -q sidecar/test_faiss_service.py
          npm run security:scan
          npm run validate
          npm run typecheck
          npm run test
          npm run build
          npm run deploy:dry

      - name: Commit only after every gate succeeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPAI Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/**'
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '^\.github/'; then
            echo 'Workflow files must not be pushed by this job.' >&2
            exit 1
          fi
          git commit -m 'complete and verify the 500-item WPAI specification'
          git push origin HEAD:agent/wpai-production-rebuild
