name: Apply WPAI Login Reliability Patch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-login-reliability-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/wpai-production-rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic fix
        run: |
          python scripts/prepare_login_patch.py
          python scripts/apply_login_reliability_patch.py
      - name: Validate source and Worker behavior
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run security:scan
          npm run validate
          npm run typecheck
          npm run test
          npm run build
          npm run deploy:dry
      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPAI Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            package.json package-lock.json \
            src/shared/contracts.ts src/worker/crypto.ts \
            src/frontend/App.tsx src/frontend/api.ts src/frontend/pages/settings.tsx \
            desktop-bootstrap/bootstrap.mjs \
            src-tauri/src/main.rs src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json \
            tests/unit/contracts.test.ts tests/worker/auth.test.ts \
            scripts/validate_spec500.py
          git diff --cached --check
          git commit -m 'fix desktop onboarding login and hidden console'
          git push origin HEAD:agent/wpai-production-rebuild
