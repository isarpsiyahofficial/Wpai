name: Generate Tauri icon assets

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths: [.tauri-icons-trigger]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic WPAI icons
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          out = Path('src-tauri/icons')
          out.mkdir(parents=True, exist_ok=True)

          def make(size: int) -> Image.Image:
              scale = size / 512
              image = Image.new('RGBA', (size, size), (9, 13, 24, 255))
              draw = ImageDraw.Draw(image)
              margin = round(48 * scale)
              radius = round(112 * scale)
              # Dark app tile and a cyan-purple diagonal mark, rendered only with shapes.
              draw.rounded_rectangle((margin, margin, size-margin, size-margin), radius=radius,
                                     fill=(17, 24, 39, 255), outline=(38, 49, 73, 255), width=max(1, round(12*scale)))
              # W built from four solid strokes; no font dependency.
              width = max(2, round(34 * scale))
              points = [
                  (round(142*scale), round(166*scale)),
                  (round(202*scale), round(346*scale)),
                  (round(256*scale), round(240*scale)),
                  (round(310*scale), round(346*scale)),
                  (round(370*scale), round(166*scale)),
              ]
              # Purple shadow and cyan foreground for a crisp high-contrast logo.
              shadow = [(x+round(8*scale), y+round(8*scale)) for x,y in points]
              draw.line(shadow, fill=(92, 68, 210, 255), width=width, joint='curve')
              draw.line(points, fill=(32, 199, 223, 255), width=width, joint='curve')
              # Small AI spark.
              cx, cy, r = round(365*scale), round(145*scale), round(28*scale)
              draw.polygon([(cx,cy-r),(cx+round(r*.28),cy-round(r*.28)),(cx+r,cy),
                            (cx+round(r*.28),cy+round(r*.28)),(cx,cy+r),
                            (cx-round(r*.28),cy+round(r*.28)),(cx-r,cy),
                            (cx-round(r*.28),cy-round(r*.28))], fill=(124, 92, 255, 255))
              return image

          base = make(512)
          base.resize((32,32), Image.Resampling.LANCZOS).save(out/'32x32.png', optimize=True)
          base.resize((128,128), Image.Resampling.LANCZOS).save(out/'128x128.png', optimize=True)
          base.resize((256,256), Image.Resampling.LANCZOS).save(out/'128x128@2x.png', optimize=True)
          base.save(out/'icon.png', optimize=True)
          base.save(out/'icon.ico', format='ICO', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])

          for path in sorted(out.iterdir()):
              if path.stat().st_size < 500:
                  raise SystemExit(f'Generated icon is unexpectedly small: {path}')
              print(path, path.stat().st_size)
          PY
      - name: Validate image signatures
        shell: python
        run: |
          from pathlib import Path
          expected = {
              'src-tauri/icons/32x32.png': b'\x89PNG\r\n\x1a\n',
              'src-tauri/icons/128x128.png': b'\x89PNG\r\n\x1a\n',
              'src-tauri/icons/128x128@2x.png': b'\x89PNG\r\n\x1a\n',
              'src-tauri/icons/icon.png': b'\x89PNG\r\n\x1a\n',
              'src-tauri/icons/icon.ico': b'\x00\x00\x01\x00',
          }
          for name, signature in expected.items():
              data = Path(name).read_bytes()
              if not data.startswith(signature):
                  raise SystemExit(f'Invalid image signature: {name}')
      - name: Commit icons and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .tauri-icons-trigger .github/workflows/generate-tauri-icons.yml
          git config user.name "WPAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "desktop: add deterministic multi-resolution Windows icons"
          git push origin HEAD:agent/wpai-production-rebuild
