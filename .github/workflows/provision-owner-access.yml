name: WPAI Owner Access Provisioning

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/provision-owner-access.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ad8e99c82c6c17d823f6877ff1efade4
  WORKER_URL: https://wa-ai-panel.wa-ai-panel.workers.dev
  ADMIN_EMAIL: owner@wpai.app
  ADMIN_NAME: WPAI Sahibi

jobs:
  provision:
    if: ${{ github.event.pull_request.head.ref == 'agent/wpai-production-rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source before production access provisioning
        run: |
          set -euo pipefail
          npm run security:scan
          npm run validate
          npm run typecheck
          npm run test
          npm run build
          npm run deploy:dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify exact Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is not configured.' >&2; exit 1; }
          result=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}")
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success||x.result.id!==process.env.CLOUDFLARE_ACCOUNT_ID) process.exit(1)' "$result"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply migrations and deploy current Worker
        run: |
          set -euo pipefail
          npm run db:remote
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Generate secure owner password and compatible hash
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const password = `Wpai-${crypto.randomBytes(30).toString('base64url')}-9A`;
          const salt = crypto.randomBytes(16);
          const hash = crypto.pbkdf2Sync(password, salt, 310000, 32, 'sha256');
          const encoded = `pbkdf2-sha256$310000$${salt.toString('base64')}$${hash.toString('base64')}`;
          const id = crypto.randomUUID();
          const now = new Date().toISOString();

          console.log(`::add-mask::${password}`);
          console.log(`::add-mask::${encoded}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `ADMIN_PASSWORD=${password}\nADMIN_PASSWORD_HASH=${encoded}\nADMIN_ID=${id}\nPROVISIONED_AT=${now}\n`);
          NODE

      - name: Create or reset the WPAI owner in production D1
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/provision-owner.sql <<SQL
          PRAGMA foreign_keys = ON;
          INSERT INTO admins
            (id, name, email, password_hash, role, status, failed_login_count, locked_until, created_at, updated_at, deleted_at)
          VALUES
            ('$ADMIN_ID', '$ADMIN_NAME', '$ADMIN_EMAIL', '$ADMIN_PASSWORD_HASH', 'owner', 'active', 0, NULL, '$PROVISIONED_AT', '$PROVISIONED_AT', NULL)
          ON CONFLICT(email) DO UPDATE SET
            name = excluded.name,
            password_hash = excluded.password_hash,
            role = 'owner',
            status = 'active',
            failed_login_count = 0,
            locked_until = NULL,
            updated_at = excluded.updated_at,
            deleted_at = NULL;

          UPDATE admin_sessions
             SET revoked_at = '$PROVISIONED_AT'
           WHERE admin_id = (SELECT id FROM admins WHERE email = '$ADMIN_EMAIL')
             AND revoked_at IS NULL;

          UPDATE desktop_sessions
             SET revoked_at = '$PROVISIONED_AT'
           WHERE admin_id = (SELECT id FROM admins WHERE email = '$ADMIN_EMAIL')
             AND revoked_at IS NULL;
          SQL
          npx wrangler d1 execute wa-ai-prod --remote --file=/tmp/provision-owner.sql
          rm -f /tmp/provision-owner.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify health and real Windows authentication path
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');

          const base = process.env.WORKER_URL;
          const email = process.env.ADMIN_EMAIL;
          const password = process.env.ADMIN_PASSWORD;
          const deviceId = `github-owner-${crypto.randomBytes(24).toString('hex')}`;

          async function jsonRequest(path, options = {}) {
            const response = await fetch(`${base}${path}`, options);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 500) }; }
            if (!response.ok || body?.ok === false) {
              throw new Error(`${body?.error?.code || `HTTP_${response.status}`}: ${body?.error?.message || 'Request failed'}`);
            }
            return body.data ?? body;
          }

          (async () => {
            let healthy = false;
            for (let attempt = 0; attempt < 18; attempt += 1) {
              try {
                const response = await fetch(`${base}/health`, { cache: 'no-store' });
                const body = await response.json();
                healthy = response.ok && body.ok && body.components?.worker && body.components?.d1;
                if (healthy) break;
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!healthy) throw new Error('PRODUCTION_HEALTH_FAILED');

            const session = await jsonRequest('/api/auth/desktop/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Origin: 'https://tauri.localhost' },
              body: JSON.stringify({
                email,
                password,
                deviceId,
                deviceName: 'WPAI Owner Verification',
                appVersion: '1.2.0'
              })
            });
            if (!session.accessToken || !session.refreshToken || session.admin?.email !== email) {
              throw new Error('DESKTOP_LOGIN_VERIFICATION_FAILED');
            }

            await jsonRequest('/api/auth/desktop/logout', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Origin: 'https://tauri.localhost' },
              body: JSON.stringify({ refreshToken: session.refreshToken, deviceId })
            });

            const content = [
              'WPAI WINDOWS GİRİŞ BİLGİLERİ',
              '',
              `ID / E-posta: ${email}`,
              `Parola: ${password}`,
              '',
              `Sunucu: ${base}`,
              'Gerçek masaüstü giriş testi: BAŞARILI',
              `Doğrulama zamanı: ${new Date().toISOString()}`,
              '',
              'İlk girişten sonra Ayarlar > Parola Değiştir alanından parolayı değiştirin.'
            ].join('\n');
            fs.writeFileSync('WPAI-OWNER-LOGIN.txt', content, { mode: 0o600 });
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Upload private verified login artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPAI-Verified-Owner-Login-${{ github.sha }}
          path: WPAI-OWNER-LOGIN.txt
          if-no-files-found: error
          retention-days: 1
