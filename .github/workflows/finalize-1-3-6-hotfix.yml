name: Finalize WPAI 1.3.6 Hotfix

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/finalize-1-3-6-hotfix.yml'

permissions:
  contents: write

jobs:
  finalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize audited version and runtime references
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          VERSION = '1.3.6'

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = VERSION
          expected_test = 'vitest run --config vitest.node.config.ts && node --test desktop-bootstrap/bootstrap.test.mjs desktop-bootstrap/bootstrap-wrapper.test.mjs'
          package['scripts']['test:unit'] = expected_test
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          tauri_path = Path('src-tauri/tauri.conf.json')
          tauri = json.loads(tauri_path.read_text(encoding='utf-8'))
          tauri['version'] = VERSION
          tauri_path.write_text(json.dumps(tauri, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          cargo_path = Path('src-tauri/Cargo.toml')
          cargo = cargo_path.read_text(encoding='utf-8')
          cargo, count = re.subn(r'(?ms)(\[package\].*?^version\s*=\s*")[^"]+("\s*$)', rf'\g<1>{VERSION}\g<2>', cargo, count=1)
          if count != 1:
            raise SystemExit('Cargo.toml package version could not be updated exactly once')
          cargo_path.write_text(cargo, encoding='utf-8')

          lock_path = Path('src-tauri/Cargo.lock')
          cargo_lock = lock_path.read_text(encoding='utf-8')
          cargo_lock, count = re.subn(r'(?m)(name = "wpai-desktop"\nversion = ")[^"]+("\n)', rf'\g<1>{VERSION}\g<2>', cargo_lock, count=1)
          if count != 1:
            raise SystemExit('Cargo.lock root package version could not be updated exactly once')
          lock_path.write_text(cargo_lock, encoding='utf-8')

          replacements = {
            'src/frontend/api.ts': [("appVersion: '1.3.5'", f"appVersion: '{VERSION}'")],
            'desktop-bootstrap/bootstrap-core.mjs': [("appVersion: '1.3.5'", f"appVersion: '{VERSION}'")],
            'scripts/validate_spec500.py': [
              ('version != "1.3.5"', f'version != "{VERSION}"'),
              ('Expected final audited version 1.3.5', f'Expected final audited version {VERSION}'),
              ('require("desktop-bootstrap/bootstrap.mjs", f"appVersion: \'{version}\'")', 'require("desktop-bootstrap/bootstrap-core.mjs", f"appVersion: \'{version}\'")')
            ]
          }
          for filename, pairs in replacements.items():
            path = Path(filename)
            value = path.read_text(encoding='utf-8')
            for old, new in pairs:
              if old not in value:
                raise SystemExit(f'Expected version anchor missing in {filename}: {old}')
              value = value.replace(old, new, 1)
            path.write_text(value, encoding='utf-8')

      - name: Regenerate deterministic npm lock metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run complete application quality gate
        run: npm run check
      - name: Verify all audited version surfaces
        shell: python
        run: |
          import json
          from pathlib import Path
          version = '1.3.6'
          package = json.loads(Path('package.json').read_text('utf-8'))
          lock = json.loads(Path('package-lock.json').read_text('utf-8'))
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text('utf-8'))
          assert package['version'] == version
          assert lock['version'] == version
          assert lock['packages']['']['version'] == version
          assert tauri['version'] == version
          assert f'version = "{version}"' in Path('src-tauri/Cargo.toml').read_text('utf-8')
          assert f'name = "wpai-desktop"\nversion = "{version}"' in Path('src-tauri/Cargo.lock').read_text('utf-8')
          assert f"appVersion: '{version}'" in Path('src/frontend/api.ts').read_text('utf-8')
          assert f"appVersion: '{version}'" in Path('desktop-bootstrap/bootstrap-core.mjs').read_text('utf-8')
      - name: Remove one-shot workflow and commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-1-3-6-hotfix.yml
          git config user.name 'WPAI Hotfix Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock src/frontend/api.ts desktop-bootstrap/bootstrap-core.mjs scripts/validate_spec500.py
          git commit -m 'fix: finalize legacy D1 schema repair as WPAI 1.3.6'
          git push origin HEAD:agent/wpai-production-rebuild
