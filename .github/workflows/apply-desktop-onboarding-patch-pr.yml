name: Apply WPAI Desktop Onboarding Patch PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-desktop-onboarding-patch-pr.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/wpai-production-rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic source patch
        run: |
          python scripts/apply_desktop_onboarding_patch.py
          python scripts/fix_desktop_onboarding_types.py
      - name: Validate patched source
        run: |
          npm ci --no-audit --no-fund
          npm run security:scan
          npm run validate
          npm run typecheck
          npm run test
          npm run build
          npm run deploy:dry
      - name: Commit patched implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPAI Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            .gitignore package.json package-lock.json scripts/validate_spec500.py \
            src/frontend/App.tsx src/frontend/api.ts src/frontend/desktop.ts src/frontend/pages/settings.tsx \
            src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/permissions/default.toml \
            src-tauri/src/lib.rs src-tauri/src/cloudflare.rs .github/workflows/windows-desktop.yml
          git diff --cached --check
          git commit -m 'enable in-app Cloudflare onboarding and setup'
          git push origin HEAD:agent/wpai-production-rebuild
