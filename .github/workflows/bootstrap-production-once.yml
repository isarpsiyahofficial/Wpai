name: Bootstrap WPAI Production Once

on:
  push:
    branches:
      - agent/wpai-production-rebuild
    paths:
      - .github/workflows/bootstrap-production-once.yml

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ad8e99c82c6c17d823f6877ff1efade4
  WORKER_URL: https://wa-ai-panel.wa-ai-panel.workers.dev
  INITIAL_ADMIN_EMAIL: owner@wpai.app
  INITIAL_ADMIN_NAME: WPAI Sahibi

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Re-run production quality gates
        run: |
          set -euo pipefail
          npm run security:scan
          npm run validate
          npm run typecheck
          npm run test
          npm run build
          npm run deploy:dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify exact Cloudflare identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is not configured.' >&2; exit 1; }
          result=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}")
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success||x.result.id!==process.env.CLOUDFLARE_ACCOUNT_ID) process.exit(1)' "$result"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Apply D1 migrations and deploy Worker
        run: |
          set -euo pipefail
          npm run db:remote
          npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Generate one-time bootstrap credentials
        shell: bash
        run: |
          set -euo pipefail
          bootstrap_token=$(node -e "process.stdout.write(require('crypto').randomBytes(48).toString('base64url'))")
          initial_password=$(node -e "process.stdout.write('Wpai-' + require('crypto').randomBytes(30).toString('base64url') + '-9A')")
          echo "::add-mask::$bootstrap_token"
          echo "::add-mask::$initial_password"
          {
            echo "BOOTSTRAP_TOKEN=$bootstrap_token"
            echo "INITIAL_ADMIN_PASSWORD=$initial_password"
          } >> "$GITHUB_ENV"

      - name: Install one-time bootstrap secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BOOTSTRAP_TOKEN" | npx wrangler secret put ADMIN_BOOTSTRAP_TOKEN --name wa-ai-panel
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            status=$(curl --silent --output /tmp/health.json --write-out '%{http_code}' "$WORKER_URL/health" || true)
            if [ "$status" = "200" ]; then
              node -e 'const x=require("/tmp/health.json"); if(!x.ok||!x.components.worker||!x.components.d1||!x.components.r2Binding||!x.components.queuesBinding||!x.components.workersAiBinding) process.exit(1)'
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json 2>/dev/null || true
          echo 'Production health did not become ready.' >&2
          exit 1

      - name: Create and verify the first desktop owner
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          const base = process.env.WORKER_URL;
          const email = process.env.INITIAL_ADMIN_EMAIL;
          const name = process.env.INITIAL_ADMIN_NAME;
          const password = process.env.INITIAL_ADMIN_PASSWORD;
          const bootstrapToken = process.env.BOOTSTRAP_TOKEN;

          async function api(path, options = {}) {
            const response = await fetch(`${base}${path}`, options);
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 500) }; }
            if (!response.ok || body?.ok === false) {
              const code = body?.error?.code || `HTTP_${response.status}`;
              const message = body?.error?.message || 'Request failed';
              throw new Error(`${code}: ${message}`);
            }
            return body.data ?? body;
          }

          (async () => {
            const setup = await api('/api/auth/setup-status');
            if (!setup.required) {
              throw new Error('SETUP_ALREADY_CLOSED: An administrator already exists; credentials cannot be recovered automatically.');
            }

            await api('/api/auth/setup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name, email, password, bootstrapToken })
            });

            const deviceId = `github-bootstrap-${crypto.randomBytes(24).toString('hex')}`;
            const session = await api('/api/auth/desktop/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Origin: 'https://tauri.localhost' },
              body: JSON.stringify({
                email,
                password,
                deviceId,
                deviceName: 'WPAI Bootstrap Verification',
                appVersion: '1.2.0'
              })
            });
            if (!session.accessToken || !session.refreshToken || session.admin?.email !== email) {
              throw new Error('DESKTOP_LOGIN_VERIFICATION_FAILED');
            }

            await api('/api/auth/desktop/logout', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Origin: 'https://tauri.localhost' },
              body: JSON.stringify({ refreshToken: session.refreshToken, deviceId })
            });

            const output = [
              'WPAI WINDOWS İLK GİRİŞ BİLGİLERİ',
              '',
              `ID / E-posta: ${email}`,
              `Parola: ${password}`,
              '',
              `Sunucu: ${base}`,
              'Masaüstü giriş doğrulaması: BAŞARILI',
              '',
              'İlk girişten sonra Ayarlar > Parola Değiştir alanından parolayı değiştirin.'
            ].join('\n');
            fs.writeFileSync('WPAI-INITIAL-LOGIN.txt', output, { mode: 0o600 });
          })().catch(error => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Upload private initial login artifact
        uses: actions/upload-artifact@v4
        with:
          name: WPAI-Initial-Login-${{ github.sha }}
          path: WPAI-INITIAL-LOGIN.txt
          if-no-files-found: error
          retention-days: 1
