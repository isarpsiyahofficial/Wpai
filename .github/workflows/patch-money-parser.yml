name: Patch money parser

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths: [.money-parser-trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - name: Correct prefix and suffix currency captures
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/worker/ai.ts')
          text = path.read_text('utf-8')
          old_pattern = "const pattern = /(?:\\b(TL|TRY|USD|EUR|AED)\\b|[₺$€])\\s*([0-9][0-9\\s.,]*)|([0-9][0-9\\s.,]*)\\s*(?:\\b(TL|TRY|USD|EUR|AED)\\b|([₺$€]))/giu;"
          new_pattern = "const pattern = /((?:\\b(?:TL|TRY|USD|EUR|AED)\\b)|[₺$€])\\s*([0-9][0-9\\s.,]*)|([0-9][0-9\\s.,]*)\\s*((?:\\b(?:TL|TRY|USD|EUR|AED)\\b)|[₺$€])/giu;"
          old_currency = "const rawCurrency = match[1] ?? match[4] ?? match[5];"
          new_currency = "const rawCurrency = match[1] ?? match[4];"
          if text.count(old_pattern) != 1 or text.count(old_currency) != 1:
              raise SystemExit('Money parser patch target mismatch')
          path.write_text(text.replace(old_pattern, new_pattern).replace(old_currency, new_currency), 'utf-8')
      - name: Commit verified patch and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .money-parser-trigger .github/workflows/patch-money-parser.yml
          git config user.name "WPAI Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: capture prefix and suffix currency symbols"
          git push origin HEAD:agent/wpai-production-rebuild
