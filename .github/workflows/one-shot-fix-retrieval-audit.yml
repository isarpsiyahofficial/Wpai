name: WPAI One-shot Retrieval Audit Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fix-retrieval-audit.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Count only approved retrieval rows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/worker/ai.ts')
          text = path.read_text('utf-8')
          old = 'JSON.stringify(input.chunkIds), input.selected.length, nowIso());'
          new = 'JSON.stringify(input.chunkIds), input.chunkIds.length, nowIso());'
          if text.count(old) != 1:
              raise SystemExit(f'RETRIEVAL_AUDIT_ANCHOR_COUNT_{text.count(old)}')
          path.write_text(text.replace(old, new), 'utf-8')
          PY
      - name: Commit source fix
        run: |
          git config user.name 'WPAI Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/worker/ai.ts
          git commit -m 'Log only approved retrieval result counts'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
