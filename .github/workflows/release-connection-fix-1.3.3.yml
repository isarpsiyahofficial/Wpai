name: Release Connection Fix 1.3.3

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - 'scripts/release_connection_fix_1_3_3.py'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply versioned connection fix
        run: python scripts/release_connection_fix_1_3_3.py
      - name: Verify package lock and application gates
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit verified 1.3.3 release source
        run: |
          rm -f scripts/release_connection_fix_1_3_3.py .github/workflows/release-connection-fix-1.3.3.yml
          git config user.name 'WPAI Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'release: WPAI 1.3.3 connection repair'
          git push origin HEAD:agent/wpai-production-rebuild
