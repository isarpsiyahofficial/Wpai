name: WPAI One-shot Spec 500 PR Apply

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-spec500-pr.yml'
      - 'scripts/apply_spec500.py'

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - name: Normalize current App import anchor
        run: |
          @'
          from pathlib import Path
          path = Path('scripts/apply_spec500.py')
          text = path.read_text('utf-8')
          text = text.replace(
              "import { AiPage, ContactsPage, DashboardPage, FilesPage, KnowledgePage, NotificationsPage, ReportsPage, SettingsPage, TrainingPage, WhatsAppPage } from './pages';",
              "import { AiPage, ContactsPage, DashboardPage, DesktopIndexPanel, FilesPage, KnowledgePage, NotificationsPage, ReportsPage, SettingsPage, TrainingPage, WhatsAppPage } from './pages';"
          )
          path.write_text(text, 'utf-8')
          '@ | python -
      - name: Apply exact native and verification patch
        run: python scripts/apply_spec500.py
      - name: Regenerate deterministic locks
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit patch for normal CI verification
        run: |
          Remove-Item scripts/apply_spec500.py
          Remove-Item .github/workflows/one-shot-spec500-hardening.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/one-shot-spec500-apply.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/one-shot-spec500-pr.yml
          git config user.name 'WPAI Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Apply native desktop and 500-item verification gates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
