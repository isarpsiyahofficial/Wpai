name: WPAI Passwordless Production Installer

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/passwordless-production-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ad8e99c82c6c17d823f6877ff1efade4
  WORKER_URL: https://wa-ai-panel.wa-ai-panel.workers.dev

jobs:
  deploy-production-runtime:
    name: Validate, migrate and deploy passwordless Worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Full source and security gate
        run: |
          npm run security:scan
          npm run validate
          npm run typecheck
          npm run test
          npm run build
          npm run deploy:dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify exact Cloudflare account and token
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          result=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}")
          node -e 'const x=JSON.parse(process.argv[1]); if(!x.success||x.result.id!==process.env.CLOUDFLARE_ACCOUNT_ID) process.exit(1)' "$result"
      - name: Apply production D1 migrations
        run: npm run db:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker and web assets
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            status=$(curl --silent --output /tmp/health.json --write-out '%{http_code}' "$WORKER_URL/health" || true)
            if [ "$status" = "200" ]; then
              node -e 'const x=require("/tmp/health.json"); if(!x.ok||!x.components.worker||!x.components.d1||!x.components.r2Binding||!x.components.queuesBinding||!x.components.workersAiBinding) process.exit(1)'
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json 2>/dev/null || true
          exit 1
      - name: Verify activation route is closed without a valid ticket
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          status=$(curl --silent --output "$body" --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H 'Origin: tauri://localhost' \
            --data '{"activationToken":"invalid-invalid-invalid-invalid-invalid-invalid","deviceId":"device-1111111111111111111111111111111111111111","deviceName":"WPAI Windows","appVersion":"1.3.6"}' \
            "$WORKER_URL/api/auth/desktop/activate")
          test "$status" = "401"
          grep -q 'DESKTOP_ACTIVATION_INVALID' "$body"

  build-and-prove:
    name: Build smoke installer, prove auto-login, then build delivery installer
    needs: deploy-production-runtime
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Install locked dependencies and sidecar toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --no-audit --no-fund
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
          python -m pytest -q sidecar/test_faiss_service.py
          pyinstaller --noconfirm --clean --onefile --name faiss-service sidecar/faiss_service.py
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          Copy-Item dist/faiss-service.exe src-tauri/bin/faiss-service-x86_64-pc-windows-msvc.exe
      - name: Windows source compile gates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run typecheck
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
          cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Prepare packaged Cloudflare runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Join-Path $PWD 'desktop-bootstrap'
          $runtime = Join-Path $bootstrap 'runtime'
          $project = Join-Path $bootstrap 'project'
          Remove-Item $runtime, $project -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtime, $project | Out-Null
          $nodeExe = (Get-Command node).Source
          $nodeHome = Split-Path -Parent $nodeExe
          Copy-Item $nodeExe (Join-Path $runtime 'node.exe')
          New-Item -ItemType Directory -Force -Path (Join-Path $runtime 'node_modules') | Out-Null
          Copy-Item (Join-Path $nodeHome 'node_modules\npm') (Join-Path $runtime 'node_modules\npm') -Recurse
          $files = @('package.json','package-lock.json','wrangler.jsonc','index.html','vite.config.ts','tsconfig.base.json','tsconfig.frontend.json','tsconfig.worker.json','tsconfig.json')
          foreach ($file in $files) { Copy-Item (Join-Path $PWD $file) (Join-Path $project $file) }
          Copy-Item (Join-Path $PWD 'src') (Join-Path $project 'src') -Recurse
          Copy-Item (Join-Path $PWD 'migrations') (Join-Path $project 'migrations') -Recurse
      - name: Create short-lived smoke activation ticket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(48)
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Output "::add-mask::$token"
          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($token)))
          $id = [Guid]::NewGuid().ToString()
          $created = [DateTime]::UtcNow.ToString('o')
          $expires = [DateTime]::UtcNow.AddHours(2).ToString('o')
          "WPAI_SMOKE_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WPAI_SMOKE_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WPAI_SMOKE_TICKET_ID=$id" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sql = "INSERT INTO desktop_activation_tokens (id,token_hash,bound_device_hash,status,expires_at,first_used_at,last_used_at,use_count,created_at) VALUES ('$id','$hash',NULL,'active','$expires',NULL,NULL,0,'$created');"
          npx wrangler d1 execute wa-ai-prod --remote --command $sql --experimental-provision=false --experimental-auto-create=false
      - name: Build smoke installer with embedded device ticket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WPAI_DESKTOP_ACTIVATION_TOKEN = $env:WPAI_SMOKE_TOKEN
          cargo clean --manifest-path src-tauri/Cargo.toml -p wpai-desktop
          npm run desktop:build
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Smoke NSIS installer was not produced' }
          Copy-Item $installer.FullName (Join-Path $PWD 'WPAI-smoke-passwordless-setup.exe') -Force
      - name: Install smoke package and launch real application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Start-Process -FilePath (Join-Path $PWD 'WPAI-smoke-passwordless-setup.exe') -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Smoke installer failed: $($install.ExitCode)" }
          $registryPaths = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty -Path $registryPaths -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'WPAI' } | Sort-Object InstallDate -Descending | Select-Object -First 1
          if (-not $entry) { throw 'Installed WPAI registry entry missing' }
          $installLocation = ([string]$entry.InstallLocation).Trim().Trim('"')
          if (-not $installLocation -or -not (Test-Path $installLocation)) { throw 'Installed WPAI location missing' }
          $installed = $null
          $displayIcon = ([string]$entry.DisplayIcon).Trim().Trim('"') -replace ',\d+$', ''
          if ($displayIcon -and (Test-Path $displayIcon)) { $installed = Get-Item $displayIcon }
          if (-not $installed) {
            $installed = Get-ChildItem -Path $installLocation -Filter *.exe -File |
              Where-Object { $_.Name -notmatch '^(faiss-service|uninstall|setup|update)' } |
              Sort-Object Length -Descending | Select-Object -First 1
          }
          if (-not $installed) { throw 'Installed WPAI executable missing' }
          "WPAI_SMOKE_INSTALLED_EXE=$($installed.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WPAI_SMOKE_INSTALL_LOCATION=$installLocation" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=9222'
          $process = Start-Process -FilePath $installed.FullName -PassThru
          "WPAI_SMOKE_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Installed WPAI exited before activation proof; exit=$($process.ExitCode)" }
      - name: Prove production D1 device binding and session creation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $verified = $false
          $last = ''
          for ($attempt = 0; $attempt -lt 24; $attempt++) {
            $sql = "SELECT t.use_count AS use_count, CASE WHEN t.bound_device_hash IS NULL THEN 0 ELSE 1 END AS bound, (SELECT COUNT(*) FROM desktop_devices d WHERE d.device_hash=t.bound_device_hash AND d.status='active') AS devices, (SELECT COUNT(*) FROM desktop_sessions ds JOIN desktop_devices d ON d.id=ds.device_id WHERE d.device_hash=t.bound_device_hash AND ds.revoked_at IS NULL AND ds.expires_at>datetime('now')) AS sessions FROM desktop_activation_tokens t WHERE t.id='$env:WPAI_SMOKE_TICKET_ID';"
            $last = (npx wrangler d1 execute wa-ai-prod --remote --command $sql --json --experimental-provision=false --experimental-auto-create=false | Out-String)
            try {
              $json = $last | ConvertFrom-Json
              $row = $json[0].results[0]
              if ([int]$row.use_count -ge 1 -and [int]$row.bound -eq 1 -and [int]$row.devices -eq 1 -and [int]$row.sessions -ge 1) {
                $verified = $true
                [ordered]@{ ticketBound=$true; useCount=[int]$row.use_count; activeDevices=[int]$row.devices; activeSessions=[int]$row.sessions } |
                  ConvertTo-Json | Set-Content -Encoding utf8 production-device-session-proof.json
                break
              }
            } catch {}
            Start-Sleep -Seconds 2
          }
          if (-not $verified) { Write-Host $last; throw 'Installed app did not create a production device-bound session' }
          Get-Content production-device-session-proof.json
      - name: Prove installed WebView opens the real panel without Cloudflare credentials
        shell: pwsh
        run: node scripts/verify-installed-webview.mjs 9222 | Tee-Object -FilePath installed-webview-proof.json
      - name: Uninstall smoke package and remove smoke production records
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if ($env:WPAI_SMOKE_PID) { Stop-Process -Id ([int]$env:WPAI_SMOKE_PID) -Force -ErrorAction SilentlyContinue }
          $registryPaths = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty -Path $registryPaths -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'WPAI' } | Sort-Object InstallDate -Descending | Select-Object -First 1
          if ($entry) {
            $text = [string]$entry.UninstallString
            $path = if ($text -match '^"([^"]+\.exe)"') { $Matches[1] } elseif ($text -match '^([^\s]+\.exe)') { $Matches[1] } else { $null }
            if ($path -and (Test-Path $path)) { Start-Process -FilePath $path -ArgumentList '/S' -Wait }
          }
          if ($env:WPAI_SMOKE_TICKET_ID) {
            $cleanup = "DELETE FROM admin_sessions WHERE id IN (SELECT ds.admin_session_id FROM desktop_sessions ds JOIN desktop_devices d ON d.id=ds.device_id JOIN desktop_activation_tokens t ON t.bound_device_hash=d.device_hash WHERE t.id='$env:WPAI_SMOKE_TICKET_ID' AND ds.admin_session_id IS NOT NULL); DELETE FROM desktop_sessions WHERE device_id IN (SELECT d.id FROM desktop_devices d JOIN desktop_activation_tokens t ON t.bound_device_hash=d.device_hash WHERE t.id='$env:WPAI_SMOKE_TICKET_ID'); DELETE FROM desktop_devices WHERE device_hash IN (SELECT bound_device_hash FROM desktop_activation_tokens WHERE id='$env:WPAI_SMOKE_TICKET_ID'); DELETE FROM desktop_activation_tokens WHERE id='$env:WPAI_SMOKE_TICKET_ID';"
            npx wrangler d1 execute wa-ai-prod --remote --command $cleanup --experimental-provision=false --experimental-auto-create=false
          }
      - name: Create delivery activation ticket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bytes = [Security.Cryptography.RandomNumberGenerator]::GetBytes(48)
          $token = [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
          Write-Output "::add-mask::$token"
          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($token)))
          $id = [Guid]::NewGuid().ToString()
          $created = [DateTime]::UtcNow.ToString('o')
          $expires = [DateTime]::UtcNow.AddDays(180).ToString('o')
          "WPAI_DELIVERY_TOKEN=$token" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WPAI_DELIVERY_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WPAI_DELIVERY_TICKET_ID=$id" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "WPAI_DELIVERY_EXPIRES=$expires" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sql = "INSERT INTO desktop_activation_tokens (id,token_hash,bound_device_hash,status,expires_at,first_used_at,last_used_at,use_count,created_at) VALUES ('$id','$hash',NULL,'active','$expires',NULL,NULL,0,'$created');"
          npx wrangler d1 execute wa-ai-prod --remote --command $sql --experimental-provision=false --experimental-auto-create=false
      - name: Build unclaimed delivery installer with fresh embedded ticket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WPAI_DESKTOP_ACTIVATION_TOKEN = $env:WPAI_DELIVERY_TOKEN
          cargo clean --manifest-path src-tauri/Cargo.toml -p wpai-desktop
          npm run desktop:build
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Delivery NSIS installer was not produced' }
          $delivery = Join-Path $PWD 'WPAI_1.3.6_PASSWORDLESS_PRODUCTION_x64-setup.exe'
          Copy-Item $installer.FullName $delivery -Force
          $hash = (Get-FileHash -Algorithm SHA256 $delivery).Hash.ToLowerInvariant()
          [ordered]@{
            checkedAt = [DateTime]::UtcNow.ToString('o')
            installer = (Split-Path -Leaf $delivery)
            installerBytes = (Get-Item $delivery).Length
            installerSha256 = $hash
            sourceHead = '${{ github.sha }}'
            worker = $env:WORKER_URL
            activationTicketId = $env:WPAI_DELIVERY_TICKET_ID
            activationExpiresAt = $env:WPAI_DELIVERY_EXPIRES
            activationBoundBeforeDelivery = $false
            userCredentialPrompt = $false
            cloudflareApiTokenPrompt = $false
            smokeProductionDeviceSessionPassed = (Test-Path production-device-session-proof.json)
            installedWebViewPassed = (Test-Path installed-webview-proof.json)
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 delivery-proof.json
      - name: Prove delivery ticket is unclaimed and embedded in package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sql = "SELECT status,CASE WHEN bound_device_hash IS NULL THEN 0 ELSE 1 END AS bound,use_count,expires_at FROM desktop_activation_tokens WHERE id='$env:WPAI_DELIVERY_TICKET_ID';"
          $raw = npx wrangler d1 execute wa-ai-prod --remote --command $sql --json --experimental-provision=false --experimental-auto-create=false | Out-String
          $json = $raw | ConvertFrom-Json
          $row = $json[0].results[0]
          if ($row.status -ne 'active' -or [int]$row.bound -ne 0 -or [int]$row.use_count -ne 0) { throw 'Delivery activation ticket was unexpectedly claimed before delivery' }

          $extract = Join-Path $env:RUNNER_TEMP 'wpai-delivery-extract'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & 7z x -y "WPAI_1.3.6_PASSWORDLESS_PRODUCTION_x64-setup.exe" "-o$extract" | Out-Null
          $candidate = Get-ChildItem -Path $extract -Filter '*.exe' -File -Recurse |
            Where-Object { $_.Name -notmatch '^(faiss-service|uninstall|setup|update)' } |
            Sort-Object Length -Descending | Select-Object -First 1
          if (-not $candidate) { throw 'Could not extract delivery application executable for activation embed proof' }
          $haystack = [IO.File]::ReadAllBytes($candidate.FullName)
          $needle = [Text.Encoding]::UTF8.GetBytes($env:WPAI_DELIVERY_TOKEN)
          $found = $false
          for ($i = 0; $i -le $haystack.Length - $needle.Length; $i++) {
            if ($haystack[$i] -ne $needle[0]) { continue }
            $match = $true
            for ($j = 1; $j -lt $needle.Length; $j++) {
              if ($haystack[$i + $j] -ne $needle[$j]) { $match = $false; break }
            }
            if ($match) { $found = $true; break }
          }
          if (-not $found) { throw 'Delivery activation ticket was not embedded in the application binary' }
          $proof = Get-Content delivery-proof.json | ConvertFrom-Json
          $proof.activationTokenEmbedded = $true
          $proof | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 delivery-proof.json
          Get-Content delivery-proof.json
      - name: Upload verified delivery installer and evidence
        uses: actions/upload-artifact@v4
        with:
          name: WPAI-Passwordless-Production-${{ github.sha }}
          path: |
            WPAI_1.3.6_PASSWORDLESS_PRODUCTION_x64-setup.exe
            delivery-proof.json
            production-device-session-proof.json
            installed-webview-proof.json
          if-no-files-found: error
          retention-days: 30
