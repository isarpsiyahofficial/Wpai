name: Apply WPAI 500 Item Completion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/apply-spec500-completion.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'agent/wpai-production-rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Reassemble and verify completion patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/fragment-checksums <<'EOF'
          a1cf78a36c048c5d304ef4c01741da925d3dcf62c2d4ef576421612c67caa189  scripts/spec500-patch/part-00
          3838db786395671d5a5ce0f703331e4e62da04418281fcf450d70bc66a87d193  scripts/spec500-patch/part-01
          16f90adad51626011389d455a5a278ddd2b67bd033bf22f41261ed2922eb8639  scripts/spec500-patch/part-02
          ca5ad9efb18d354ca16e2abf13c0c29f1b048d9f87c0688439eb0899b86f3d01  scripts/spec500-patch/part-03
          802c4941e83e0cb4339220f6c83dad9e6455a5d83ec5376ace6c9d34ccdfe1ae  scripts/spec500-patch/part-04
          EOF
          sha256sum --check /tmp/fragment-checksums
          cat scripts/spec500-patch/part-* > /tmp/spec500-completion.patch.gz.b64
          echo '82d1aeb192f3ec59a7b218baf55c517a9b2c2b7c992775e53167a719c0b73b8e  /tmp/spec500-completion.patch.gz.b64' | sha256sum --check
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          encoded = Path('/tmp/spec500-completion.patch.gz.b64').read_bytes()
          Path('/tmp/spec500-completion.patch').write_bytes(gzip.decompress(base64.b64decode(encoded, validate=True)))
          PY
          echo '6d241cca3f272bc703716f91fa496a5217239d910505d3c8021dd72690c1ba1b  /tmp/spec500-completion.patch' | sha256sum --check
          git apply --check /tmp/spec500-completion.patch
          git apply /tmp/spec500-completion.patch
          rm -rf scripts/spec500-patch

      - name: Verify Python and static source integrity
        run: |
          set -euo pipefail
          python -m compileall -q scripts sidecar
          python scripts/sync_brand.py
          python scripts/validate.py
          python scripts/validate_spec500.py

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install and test FAISS sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
          python -m pytest -q sidecar/test_faiss_service.py

      - name: Run complete application gates
        run: |
          set -euo pipefail
          npm run security:scan
          npm run validate
          npm run typecheck
          npm run test
          npm run build
          npm run deploy:dry

      - name: Commit verified product implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPAI Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A -- . ':(exclude).github/**'
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '^\.github/'; then
            echo 'Workflow files must not be pushed by this job.' >&2
            exit 1
          fi
          git commit -m 'complete and verify the 500-item WPAI specification'
          git push origin HEAD:agent/wpai-production-rebuild
