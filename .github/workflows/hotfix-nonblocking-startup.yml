name: WPAI Hotfix Nonblocking Startup

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/hotfix-nonblocking-startup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply nonblocking startup patch
        run: python scripts/hotfix_nonblocking_startup.py
      - name: Install dependencies and validate hotfix
        run: |
          npm ci --no-audit --no-fund
          npm run validate
          npm run typecheck
          npm run test:oauth
          npm run test:unit
          git diff --check
      - name: Commit hotfix integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/frontend/App.tsx src-tauri/src/cloudflare.rs scripts/validate_spec500.py tests/e2e/auth-regression.spec.mjs README.md docs/WINDOWS-KURULUM-KALDIRMA.md
          git commit -m 'Prevent first-run connection screen from hanging'
          git push origin HEAD:agent/wpai-production-rebuild
