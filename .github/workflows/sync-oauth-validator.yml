name: WPAI Sync OAuth Validator

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/sync-oauth-validator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add OAuth runtime to static validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/validate.py')
          text = p.read_text('utf-8')
          old = '"brand/product-brand.json", "scripts/sync_brand.py", "docs/SPEC-500-EVIDENCE.json",'
          new = '"brand/product-brand.json", "scripts/sync_brand.py", "docs/SPEC-500-EVIDENCE.json",\n        "desktop-bootstrap/oauth-device-bootstrap.mjs", "desktop-bootstrap/oauth-device-bootstrap.test.mjs",'
          if '"desktop-bootstrap/oauth-device-bootstrap.mjs"' not in text:
              if old not in text: raise SystemExit('bootstrap required-file anchor missing')
              text = text.replace(old, new, 1)
          old = '"src-tauri/Cargo.toml", "src-tauri/Cargo.lock", "src-tauri/tauri.conf.json", "src-tauri/src/lib.rs",'
          new = '"src-tauri/Cargo.toml", "src-tauri/Cargo.lock", "src-tauri/tauri.conf.json", "src-tauri/src/lib.rs",\n        "src-tauri/src/oauth_bootstrap.rs",'
          if '"src-tauri/src/oauth_bootstrap.rs"' not in text:
              if old not in text: raise SystemExit('native required-file anchor missing')
              text = text.replace(old, new, 1)
          old = 'for required in ("phase: \'connections\'", "DesktopConnectionsPage", "cloudflareConnectionStatus", "restoreDesktopSession", "Cihaz Bağlantısını Yeniden Dene"):'
          new = 'for required in ("phase: \'connections\'", "DesktopConnectionsPage", "cloudflareConnectionStatus", "restoreDesktopSession", "openCloudflareBrowserLogin", "Cloudflare Oturumunu Aç", "Cihaz Bağlantısını Yeniden Dene"):'
          if old in text:
              text = text.replace(old, new, 1)
          p.write_text(text, 'utf-8')
          PY
          python scripts/validate.py
          git diff --check
      - name: Commit validation coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Validate Wrangler OAuth runtime files'
          git push origin HEAD:agent/wpai-production-rebuild
