name: WPAI Sync Passwordless Gates

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/sync-passwordless-gates.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize validators and responsive passwordless coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text('utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old[:100]}')
              text = text.replace(old, new, 1)
              p.write_text(text, 'utf-8')

          validate = Path('scripts/validate.py')
          text = validate.read_text('utf-8')
          text = text.replace(
              '"migrations/0008_training_publication_links.sql", "migrations/0009_source_extractions.sql",',
              '"migrations/0008_training_publication_links.sql", "migrations/0009_source_extractions.sql",\n        "migrations/0010_desktop_activation_tokens.sql",'
          )
          text = text.replace(
              '"tests/worker/auth.test.ts", "tests/worker/isolation-and-gates.test.ts", "tests/worker/webhook.test.ts",',
              '"tests/worker/auth.test.ts", "tests/worker/device-activation.test.ts", "tests/worker/isolation-and-gates.test.ts", "tests/worker/webhook.test.ts",'
          )
          text = text.replace(
              '"knowledge_versions", "vector_sync_jobs", "retrieval_logs", "desktop_devices", "desktop_sessions",',
              '"knowledge_versions", "vector_sync_jobs", "retrieval_logs", "desktop_devices", "desktop_sessions", "desktop_activation_tokens",'
          )
          text = text.replace(
              '"critical administrator workflows", "setup and login screens", "API failure"',
              '"critical administrator workflows", "credential-free device connection", "API failure"'
          )
          text = text.replace(
              '"removing a saved connection keeps it removed",\n        "Cloudflare Bağlantısı",\n        "Bağlantıyı Kaldır",\n        "Yerel Bilgi Modu"',
              '"removing a saved device connection keeps it removed",\n        "WPAI Cihaz Bağlantısı",\n        "Bu Cihazın Bağlantısını Kaldır",\n        "input[name=\\\"apiToken\\\"]",\n        "Yerel Bilgi Modu"'
          )
          text = text.replace(
              'for required in ("phase: \'connections\'", "DesktopConnectionsPage", "cloudflareConnectionStatus", "Bağlantıyı Kaldır"):',
              'for required in ("phase: \'connections\'", "DesktopConnectionsPage", "cloudflareConnectionStatus", "restoreDesktopSession", "Cihaz Bağlantısını Yeniden Dene"):'
          )
          text = text.replace(
              'for forbidden in ("Yönetici e-postası<input", "Yeni parola<input", "Parola tekrarı<input", "Panele Giriş Yap"):',
              'for forbidden in ("Yönetici e-postası<input", "Yeni parola<input", "Parola tekrarı<input", "Panele Giriş Yap", "name=\\\"apiToken\\\"", "Cloudflare User veya Account API Token"):'
          )
          text = text.replace(
              '"Cloudflare Bağlantısı", "WhatsApp / Meta Bağlantısı", "Bağlantı Bilgisini Güncelle",\n        "Bağlantıyı Kaldır", "Bağlı"',
              '"WPAI Cihaz Bağlantısı", "WhatsApp / Meta Bağlantısı", "Cihaz Bağlantısını Doğrula",\n        "Bu Cihazın Bağlantısını Kaldır", "Hazır"'
          )
          text = text.replace(
              '"<h3>Parola Değiştir</h3>", "Mevcut parola<input", "Yeni parola tekrarı<input"',
              '"<h3>Parola Değiştir</h3>", "Mevcut parola<input", "Yeni parola tekrarı<input",\n        "name=\\\"apiToken\\\"", "Yeni Cloudflare API Token", "Cloudflare User veya Account API Token"'
          )
          validate.write_text(text, 'utf-8')

          spec = Path('scripts/validate_spec500.py')
          text = spec.read_text('utf-8')
          old_app = '''    require(
              "src/frontend/App.tsx",
              "phase: 'connections'",
              "DesktopConnectionsPage",
              "cloudflareConnectionStatus",
              "Bağlantıyı Kaldır",
              "Yalnız Cloudflare API tokeni kullanılır",
              "Yönetici e-postası, kullanıcı adı veya parola istenmez",
              "device-bootstrap-v6"
          )'''
          new_app = '''    require(
              "src/frontend/App.tsx",
              "phase: 'connections'",
              "DesktopConnectionsPage",
              "cloudflareConnectionStatus",
              "restoreDesktopSession",
              "Cihaz Bağlantısını Yeniden Dene",
              "kullanıcı adı, e-posta, parola veya Cloudflare API tokeni istemeden"
          )'''
          if old_app not in text:
              raise SystemExit('validate_spec500 App anchor missing')
          text = text.replace(old_app, new_app, 1)
          text = text.replace(
              '"Panele Giriş Yap"\n    )',
              '"Panele Giriş Yap",\n        "name=\\\"apiToken\\\"",\n        "Cloudflare User veya Account API Token"\n    )', 1
          )
          old_settings = '''    require(
              "src/frontend/pages/settings.tsx",
              "Cloudflare Bağlantısı",
              "WhatsApp / Meta Bağlantısı",
              "Bağlantı Bilgisini Güncelle",
              "Bağlantıyı Kaldır",
              "D1, R2 ve müşteri verileri silinmez"
          )'''
          new_settings = '''    require(
              "src/frontend/pages/settings.tsx",
              "WPAI Cihaz Bağlantısı",
              "WhatsApp / Meta Bağlantısı",
              "Cihaz Bağlantısını Doğrula",
              "Bu Cihazın Bağlantısını Kaldır",
              "D1, R2 ve müşteri verileri silinmez"
          )
          forbid(
              "src/frontend/pages/settings.tsx",
              "name=\\\"apiToken\\\"",
              "Yeni Cloudflare API Token",
              "Cloudflare User veya Account API Token"
          )
          require("migrations/0010_desktop_activation_tokens.sql", "desktop_activation_tokens", "bound_device_hash", "expires_at")
          require("src/worker/desktopAuth.ts", "/desktop/activate", "DESKTOP_ACTIVATION_BOUND", "desktop_activation_tokens")
          require("tests/worker/device-activation.test.ts", "same installer ticket", "expired installer ticket")'''
          if old_settings not in text:
              raise SystemExit('validate_spec500 Settings anchor missing')
          text = text.replace(old_settings, new_settings, 1)
          text = text.replace(
              '"removing a saved connection keeps it removed",',
              '"removing a saved device connection keeps it removed",'
          )
          text = text.replace(
              '"Cloudflare Account ID"\n    )',
              '"Cloudflare Account ID",\n        "input[name=\\\"apiToken\\\"]"\n    )'
          )
          text = text.replace(
              'if package.get("overrides", {}).get("undici") != "7.29.0":',
              'if package.get("overrides", {}).get("nanoid") != "3.3.18":\n        raise AssertionError("Patched Nano ID override is not pinned")\n    if lock.get("packages", {}).get("node_modules/nanoid", {}).get("version") != "3.3.18":\n        raise AssertionError("package-lock.json does not contain patched nanoid 3.3.18")\n    if package.get("overrides", {}).get("undici") != "7.29.0":'
          )
          spec.write_text(text, 'utf-8')

          responsive = Path('tests/e2e/responsive.spec.mjs')
          text = responsive.read_text('utf-8')
          text = text.replace(
              "await expect(page.getByRole('heading', { name: 'Cloudflare Bağlantısı' })).toBeVisible();",
              "await expect(page.getByRole('heading', { name: 'WPAI Cihaz Bağlantısı' })).toBeVisible();"
          )
          text = text.replace(
              "await expect(page.getByText('Cloudflare hesap bağlantısı WPAI Windows uygulamasındaki Ayarlar bölümünden yönetilir.')).toBeVisible();",
              "await expect(page.getByText('Cihaz bağlantısı yalnız WPAI Windows uygulamasında kullanılır.')).toBeVisible();"
          )
          text = text.replace(
              "await expect(page.getByLabel('Sınırlı Cloudflare API Token', { exact: true })).toHaveCount(0);",
              "await expect(page.getByLabel('Sınırlı Cloudflare API Token', { exact: true })).toHaveCount(0);\n  await expect(page.locator('input[name=\\\"apiToken\\\"]')).toHaveCount(0);"
          )
          pattern = re.compile(r"test\('setup and login screens are responsive on the narrowest supported phone', async \(\{ page \}\) => \{.*?\n\}\);\n\n(?=test\('API failure)", re.S)
          replacement = '''test('credential-free device connection stays responsive on the narrowest supported phone', async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 568 });
            await installMocks(page);
            await page.goto('/');
            await page.getByRole('button', { name: 'Ayarlar', exact: true }).click();
            await expect(page.getByRole('heading', { name: 'WPAI Cihaz Bağlantısı' })).toBeVisible();
            await expect(page.locator('input[name="apiToken"]')).toHaveCount(0);
            await expect(page.getByRole('heading', { name: 'İlk Yönetici Kurulumu' })).toHaveCount(0);
            await expect(page.getByRole('button', { name: 'Giriş Yap' })).toHaveCount(0);
            await assertLayout(page, 'credential-free device connection/320');
          });

          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('responsive legacy setup/login block missing')
          responsive.write_text(text, 'utf-8')
          PY
      - name: Commit synchronized gates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate.py scripts/validate_spec500.py tests/e2e/responsive.spec.mjs
          git diff --cached --check
          git commit -m 'Synchronize passwordless device activation gates'
          git push origin HEAD:agent/wpai-production-rebuild
