name: WPAI Windows Installer

on:
  push:
    branches: [main, agent/wpai-production-rebuild]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'sidecar/**'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wpai-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-current-head:
    if: github.event_name == 'push' && github.ref == 'refs/heads/agent/wpai-production-rebuild'
    name: Verify and apply strict source fixes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact corrections and restore this workflow
        shell: python
        run: |
          from pathlib import Path

          operations = Path('src/worker/operationsApi.ts')
          value = operations.read_text('utf-8')
          for old, new in {
              "new TextDecoder('utf-8', { fatal: false })": "new TextDecoder('utf-8', { fatal: false, ignoreBOM: false })",
              "VALUES (?,?,?,'admin',?,?,?,?,?)": "VALUES (?,?,?,'admin',?,?,?,?)",
          }.items():
              if old not in value:
                  raise SystemExit(f'operationsApi source missing: {old}')
              value = value.replace(old, new, 1)
          operations.write_text(value, 'utf-8')

          training = Path('src/worker/trainingApi.ts')
          value = training.read_text('utf-8')
          old = "  const checksum = await itemChecksum(input);"
          new = """  const checksum = await itemChecksum({
            itemType: input.itemType,
            title: input.title,
            content: input.content,
            expectedResponse: input.expectedResponse ?? null,
            usagePermission: input.usagePermission,
            scope: input.scope,
            contactId: input.contactId ?? null,
            conversationId: input.conversationId ?? null,
            priority: input.priority,
            validFrom: input.validFrom ?? null,
            validUntil: input.validUntil ?? null
          });"""
          if old not in value:
              raise SystemExit('training item checksum source missing')
          value = value.replace(old, new, 1)
          old = "{ conversionOptions: { output: { format: 'markdown' }, pdf: { metadata: false } } }"
          if old not in value:
              raise SystemExit('toMarkdown options source missing')
          value = value.replace(old, "{ conversionOptions: { pdf: { metadata: false } } }", 1)
          old = "    const itemChecksum = await itemChecksum({"
          if old not in value:
              raise SystemExit('checksum shadow source missing')
          value = value.replace(old, "    const draftChecksum = await itemChecksum({", 1)
          old = ").bind(itemId, threadId, title, extracted, itemChecksum, c.get('adminId')!, finished, finished)"
          if old not in value:
              raise SystemExit('draft checksum bind source missing')
          value = value.replace(old, ").bind(itemId, threadId, title, extracted, draftChecksum, c.get('adminId')!, finished, finished)", 1)
          training.write_text(value, 'utf-8')

          one_shot = Path('.github/workflows/one-shot-current-fixes.yml')
          if one_shot.exists():
              one_shot.unlink()

          Path('.github/workflows/windows-desktop.yml').write_text('''name: WPAI Windows Installer

on:
  push:
    branches: [main, agent/wpai-production-rebuild]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'sidecar/**'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpai-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build and verify NSIS setup.exe
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Install locked JavaScript dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Install FAISS sidecar dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
      - name: Compile and test FAISS sidecar
        shell: pwsh
        run: |
          python -m compileall -q sidecar
          python -m pytest -q sidecar/test_faiss_service.py
      - name: Build FAISS sidecar executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name faiss-service sidecar/faiss_service.py
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          Copy-Item dist/faiss-service.exe src-tauri/bin/faiss-service-x86_64-pc-windows-msvc.exe
          if (-not (Test-Path src-tauri/bin/faiss-service-x86_64-pc-windows-msvc.exe)) { throw 'FAISS sidecar executable missing' }
      - name: Typecheck web and Worker source
        shell: pwsh
        run: npm run typecheck
      - name: Rust locked unit tests
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust Clippy with warnings denied
        shell: pwsh
        run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust locked compile check
        shell: pwsh
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer
        shell: pwsh
        run: npm run desktop:build
      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse
          if ($installers.Count -lt 1) { throw 'NSIS setup.exe was not produced' }
          $installers | ForEach-Object { Write-Host "$($_.FullName) $($_.Length) bytes" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WPAI-Windows-Setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
''', 'utf-8')
