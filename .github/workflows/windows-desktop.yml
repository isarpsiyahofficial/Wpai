name: WPAI Windows Installer

on:
  push:
    branches: [main, agent/wpai-production-rebuild]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'sidecar/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-desktop.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpai-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Build and verify NSIS setup.exe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install locked JavaScript dependencies
        shell: pwsh
        run: npm ci --no-audit --no-fund
      - name: Install FAISS sidecar dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
      - name: Test FAISS sidecar
        shell: pwsh
        run: python -m pytest -q sidecar/test_faiss_service.py
      - name: Build FAISS sidecar executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name faiss-service sidecar/faiss_service.py
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          Copy-Item dist/faiss-service.exe src-tauri/bin/faiss-service-x86_64-pc-windows-msvc.exe
          if (-not (Test-Path src-tauri/bin/faiss-service-x86_64-pc-windows-msvc.exe)) { throw 'FAISS sidecar executable missing' }
      - name: Typecheck web and Worker source
        shell: pwsh
        run: npm run typecheck
      - name: Rust locked compile check
        shell: pwsh
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Build NSIS installer
        shell: pwsh
        run: npm run desktop:build
      - name: Verify installer output
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse
          if ($installers.Count -lt 1) { throw 'NSIS setup.exe was not produced' }
          $installers | ForEach-Object { Write-Host "$($_.FullName) $($_.Length) bytes" }
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WPAI-Windows-Setup-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
