name: WPAI One-shot Spec 500 Apply

on:
  push:
    branches: [agent/wpai-production-rebuild]
    paths:
      - '.github/workflows/one-shot-spec500-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - name: Apply native and verification changes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def once(path: str, old: str, new: str) -> None:
              file = Path(path)
              value = file.read_text('utf-8')
              if new in value:
                  return
              if old not in value:
                  raise SystemExit(f'MISSING_ANCHOR:{path}:{old[:80]}')
              file.write_text(value.replace(old, new, 1), 'utf-8')

          once('tests/worker/management-api.test.ts',
            "    vi.spyOn(env.AI,'run').mockResolvedValue({data:[[1,0,0]],usage:{input_tokens:10}} as never); vi.spyOn(env.KNOWLEDGE_INDEX,'upsert').mockResolvedValue({count:1,ids:['x']} as never);\n    const approved=await request(`/api/knowledge/${knowledgeId}`,{method:'PUT',headers:authHeaders(auth),body:JSON.stringify({title:'Teslim Süreci',category:'Süreç',content:'Kapsam onayından sonra geliştirme başlar.',status:'approved',usagePermission:'both'})}); expect(approved.status).toBe(200);\n    const row=await env.DB.prepare('SELECT status,usage_permission,vector_status,vector_version FROM business_knowledge WHERE id=?').bind(knowledgeId).first(); expect(row).toMatchObject({status:'approved',usage_permission:'both',vector_status:'indexed',vector_version:1});",
            "    const approved=await request(`/api/knowledge/${knowledgeId}`,{method:'PUT',headers:authHeaders(auth),body:JSON.stringify({title:'Teslim Süreci',category:'Süreç',content:'Kapsam onayından sonra geliştirme başlar.',status:'approved',usagePermission:'both'})}); expect(approved.status).toBe(200);\n    const row=await env.DB.prepare('SELECT status,usage_permission,vector_status,vector_version FROM business_knowledge WHERE id=?').bind(knowledgeId).first(); expect(row).toMatchObject({status:'approved',usage_permission:'both',vector_status:'pending',vector_version:0});\n    const vectorJob=await env.DB.prepare('SELECT operation,target,status FROM vector_sync_jobs WHERE knowledge_id=? ORDER BY created_at DESC LIMIT 1').bind(knowledgeId).first(); expect(vectorJob).toMatchObject({operation:'upsert',target:'cloud',status:'queued'});"
          )

          once('src-tauri/Cargo.toml', 'tauri-plugin-shell = "2.3.3"\n',
            'tauri-plugin-shell = "2.3.3"\ntauri-plugin-single-instance = "2"\ntauri-plugin-dialog = "2"\ntauri-plugin-notification = "2"\n')
          once('src-tauri/src/lib.rs', 'use tauri_plugin_shell::ShellExt;\n',
            'use tauri_plugin_dialog::DialogExt;\nuse tauri_plugin_notification::NotificationExt;\nuse tauri_plugin_shell::ShellExt;\n')
          once('src-tauri/src/lib.rs',
            '#[derive(Debug, Serialize, Deserialize)]\n#[serde(rename_all = "camelCase")]\nstruct FaissMatch {\n    id: String,\n    score: f32,\n    metadata: Value,\n}\n',
            '#[derive(Debug, Serialize, Deserialize)]\n#[serde(rename_all = "camelCase")]\nstruct FaissMatch {\n    id: String,\n    score: f32,\n    metadata: Value,\n}\n\n#[derive(Debug, Serialize)]\n#[serde(rename_all = "camelCase")]\nstruct PickedDesktopFile {\n    name: String,\n    mime_type: String,\n    bytes: Vec<u8>,\n}\n')
          once('src-tauri/src/lib.rs', '#[tauri::command]\nfn show_main_window(app: AppHandle) -> Result<(), String> {', '''fn supported_file_mime(extension: &str) -> Option<&'static str> {\n    match extension.to_ascii_lowercase().as_str() {\n        "png" => Some("image/png"),\n        "jpg" | "jpeg" => Some("image/jpeg"),\n        "webp" => Some("image/webp"),\n        "pdf" => Some("application/pdf"),\n        "docx" => Some("application/vnd.openxmlformats-officedocument.wordprocessingml.document"),\n        "xlsx" => Some("application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"),\n        "csv" => Some("text/csv"),\n        "txt" => Some("text/plain"),\n        _ => None,\n    }\n}\n\n#[tauri::command]\nasync fn pick_desktop_file(app: AppHandle) -> Result<Option<PickedDesktopFile>, String> {\n    let selected = app.dialog().file().add_filter(\n        "WPAI desteklenen dosyalar",\n        &["png", "jpg", "jpeg", "webp", "pdf", "docx", "xlsx", "csv", "txt"],\n    ).blocking_pick_file();\n    let Some(selected) = selected else { return Ok(None); };\n    let path = selected.into_path().map_err(|_| "Seçilen dosya yolu okunamadı.".to_string())?;\n    let metadata = fs::metadata(&path).map_err(|_| "Seçilen dosya bilgisi okunamadı.".to_string())?;\n    if !metadata.is_file() || metadata.len() == 0 || metadata.len() > 25 * 1024 * 1024 {\n        return Err("Dosya boş olamaz ve 25 MB sınırını aşamaz.".into());\n    }\n    let extension = path.extension().and_then(|value| value.to_str()).unwrap_or_default();\n    let mime_type = supported_file_mime(extension).ok_or_else(|| "Bu dosya türü desteklenmiyor.".to_string())?;\n    let bytes = fs::read(&path).map_err(|_| "Seçilen dosya okunamadı.".to_string())?;\n    let name = path.file_name().and_then(|value| value.to_str()).unwrap_or("wpai-dosya").chars().take(180).collect();\n    Ok(Some(PickedDesktopFile { name, mime_type: mime_type.into(), bytes }))\n}\n\n#[tauri::command(rename_all = "camelCase")]\nfn show_desktop_notification(app: AppHandle, title: String, body: String) -> Result<(), String> {\n    let safe_title = title.trim().to_string();\n    let safe_body = body.trim().to_string();\n    if safe_title.is_empty() || safe_title.chars().count() > 100 || safe_body.is_empty() || safe_body.chars().count() > 500 {\n        return Err("Bildirim başlığı veya içeriği geçersiz.".into());\n    }\n    app.notification().builder().title(safe_title).body(safe_body).show()\n        .map_err(|_| "Windows bildirimi gösterilemedi.".to_string())\n}\n\n#[tauri::command]\nfn show_main_window(app: AppHandle) -> Result<(), String> {''')
          once('src-tauri/src/lib.rs',
            '    tauri::Builder::default()\n        .manage(Mutex::new(DesktopPreferences::default()))\n        .plugin(tauri_plugin_shell::init())\n',
            '    tauri::Builder::default()\n        .plugin(tauri_plugin_single_instance::init(|app, _args, _cwd| {\n            if let Some(window) = app.get_webview_window("main") {\n                let _ = window.show();\n                let _ = window.unminimize();\n                let _ = window.set_focus();\n            }\n        }))\n        .manage(Mutex::new(DesktopPreferences::default()))\n        .plugin(tauri_plugin_shell::init())\n        .plugin(tauri_plugin_dialog::init())\n        .plugin(tauri_plugin_notification::init())\n')
          once('src-tauri/src/lib.rs', '            set_windows_autostart,\n            show_main_window,\n',
            '            set_windows_autostart,\n            pick_desktop_file,\n            show_desktop_notification,\n            show_main_window,\n')
          once('src-tauri/permissions/default.toml', '  "set_windows_autostart",\n  "show_main_window",\n',
            '  "set_windows_autostart",\n  "pick_desktop_file",\n  "show_desktop_notification",\n  "show_main_window",\n')
          once('src/frontend/desktop.ts', '  showMainWindow(): Promise<void> {\n    return requiredInvoke<void>(\'show_main_window\');\n  },\n', '''  pickFile(): Promise<{ name: string; mimeType: string; bytes: number[] } | null> {\n    return requiredInvoke<{ name: string; mimeType: string; bytes: number[] } | null>('pick_desktop_file');\n  },\n  notify(title: string, body: string): Promise<void> {\n    return requiredInvoke<void>('show_desktop_notification', { title, body });\n  },\n  showMainWindow(): Promise<void> {\n    return requiredInvoke<void>('show_main_window');\n  },\n''')
          once('src/frontend/pages/whatsapp.tsx', "import { Empty, formatDate } from './core';\n",
            "import { Empty, formatDate } from './core';\nimport { desktop } from '../desktop';\n")
          once('src/frontend/pages/whatsapp.tsx', '  async function changeMode(mode: string, pausedUntil: string | null = null) {', '''  async function chooseAttachment() {\n    if (desktop.available()) {\n      try {\n        const selected = await desktop.pickFile();\n        if (!selected) return;\n        await upload(new File([new Uint8Array(selected.bytes)], selected.name, { type: selected.mimeType }));\n      } catch (error) {\n        notify(error instanceof Error ? error.message : 'Native dosya seçici açılamadı.', 'error');\n      }\n      return;\n    }\n    fileRef.current?.click();\n  }\n\n  async function changeMode(mode: string, pausedUntil: string | null = null) {''')
          once('src/frontend/pages/whatsapp.tsx', '<button type="button" className="button secondary" onClick={() => fileRef.current?.click()} disabled={busy}>Dosya Ekle</button>',
            '<button type="button" className="button secondary" onClick={() => void chooseAttachment()} disabled={busy}>Dosya Ekle</button>')
          once('src/frontend/App.tsx', "import { AiPage, ContactsPage, DashboardPage, FilesPage, KnowledgePage, NotificationsPage, ReportsPage, SettingsPage, TrainingPage, WhatsAppPage } from './pages';\n",
            "import { AiPage, ContactsPage, DashboardPage, FilesPage, KnowledgePage, NotificationsPage, ReportsPage, SettingsPage, TrainingPage, WhatsAppPage } from './pages';\nimport { desktop } from './desktop';\n")
          once('src/frontend/App.tsx', "  const notify: Notify = useCallback((message, kind = 'info') => {\n    setToast({ message, kind });\n    window.setTimeout(() => setToast(null), 4500);\n  }, []);", "  const notify: Notify = useCallback((message, kind = 'info') => {\n    setToast({ message, kind });\n    window.setTimeout(() => setToast(null), 4500);\n    if (desktopMode && document.hidden) {\n      void desktop.notify(kind === 'error' ? 'WPAI uyarısı' : 'WPAI bildirimi', message).catch(() => undefined);\n    }\n  }, [desktopMode]);")

          package = Path('package.json')
          package_text = package.read_text('utf-8').replace('"validate": "python scripts/validate.py"', '"validate": "python scripts/validate.py && python scripts/validate_spec500.py"')
          package.write_text(package_text, 'utf-8')

          Path('scripts/validate_spec500.py').write_text('''from __future__ import annotations\nimport json\nfrom pathlib import Path\nROOT=Path(__file__).resolve().parents[1]\ndef t(p): return (ROOT/p).read_text("utf-8")\ndef req(p,*n):\n v=t(p)\n for x in n:\n  if x not in v: raise AssertionError(f"500-item gate missing in {p}: {x}")\ndef main():\n p=json.loads(t("package.json")); l=json.loads(t("package-lock.json"))\n assert p.get("overrides",{}).get("undici")=="7.29.0"\n assert l.get("packages",{}).get("node_modules/undici",{}).get("version")=="7.29.0"\n req("src-tauri/Cargo.toml","tauri-plugin-single-instance","tauri-plugin-dialog","tauri-plugin-notification")\n req("src-tauri/src/lib.rs","tauri_plugin_single_instance::init","pick_desktop_file","show_desktop_notification","faiss_replace")\n req("src/frontend/pages/whatsapp.tsx","desktop.pickFile()")\n req("src/frontend/App.tsx","desktop.notify(")\n req("tests/worker/training-vector.test.ts","wrong-customer vectors","prompt injection","duplicate: true")\n req("tests/worker/meta-paused-queue.test.ts","does not call Meta")\n req("tests/e2e/responsive.spec.mjs","['training', 'AI Eğitim Merkezi']")\n req("migrations/0010_vector_artifacts.sql","knowledge_vector_artifacts")\n req("src/worker/localIndexApi.ts","/training/local-index-bundle")\n req(".github/workflows/windows-desktop.yml","Real NSIS install, open, single-instance and uninstall smoke","windows-smoke.json")\n tauri=json.loads(t("src-tauri/tauri.conf.json")); assert tauri["build"]["frontendDist"]=="../dist/web"\n for w in tauri["app"]["windows"]: assert "workers.dev" not in str(w.get("url",""))\n source="\\n".join(t(x) for x in ("src/worker/index.ts","src/worker/api.ts","src/worker/extendedApi.ts","src/worker/operationsApi.ts"))\n assert "'/campaign" not in source and '\"/campaign' not in source and "wa-campaign" not in source\n print("500-item additions validation passed.")\nif __name__=="__main__": main()\n''','utf-8')
          '@ | python -
      - name: Write Windows lifecycle workflow
        shell: pwsh
        run: |
          @'
          name: WPAI Windows Installer
          on:
            push:
              branches: [main, agent/wpai-production-rebuild]
              paths: ['src/**','src-tauri/**','sidecar/**','rust-toolchain.toml','package.json','package-lock.json','scripts/validate_spec500.py','.github/workflows/windows-desktop.yml']
            pull_request:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          concurrency:
            group: wpai-windows-${{ github.ref }}
            cancel-in-progress: true
          jobs:
            installer:
              name: Build, install and verify NSIS setup.exe
              runs-on: windows-latest
              timeout-minutes: 60
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with: {node-version: 22, cache: npm}
                - uses: actions/setup-python@v5
                  with: {python-version: '3.12'}
                - uses: dtolnay/rust-toolchain@master
                  with: {toolchain: 1.97.1, targets: x86_64-pc-windows-msvc, components: clippy}
                - name: Install locked JavaScript dependencies
                  run: npm ci --no-audit --no-fund
                - name: Install FAISS sidecar dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install -r sidecar/requirements.txt
                - name: Compile and test FAISS sidecar
                  run: |
                    python -m compileall -q sidecar
                    python -m pytest -q sidecar/test_faiss_service.py
                - name: Build FAISS sidecar executable
                  run: |
                    pyinstaller --noconfirm --clean --onefile --name faiss-service sidecar/faiss_service.py
                    New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
                    Copy-Item dist/faiss-service.exe src-tauri/bin/faiss-service-x86_64-pc-windows-msvc.exe
                - name: Typecheck web and Worker source
                  run: npm run typecheck
                - name: Rust locked unit tests
                  run: cargo test --locked --manifest-path src-tauri/Cargo.toml
                - name: Rust Clippy with warnings denied
                  run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
                - name: Rust locked compile check
                  run: cargo check --locked --manifest-path src-tauri/Cargo.toml
                - name: Build NSIS installer
                  run: npm run desktop:build
                - name: Real NSIS install, open, single-instance and uninstall smoke
                  run: |
                    $ErrorActionPreference='Stop'
                    $installer=Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse|Select-Object -First 1
                    if(-not $installer){throw 'NSIS setup.exe was not produced'}
                    $hash=(Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
                    $signature=(Get-AuthenticodeSignature $installer.FullName).Status.ToString()
                    $p=Start-Process $installer.FullName -ArgumentList '/S' -PassThru -Wait
                    if($p.ExitCode-ne 0){throw "Install failed $($p.ExitCode)"}
                    $installed=Get-ChildItem $env:LOCALAPPDATA -Filter WPAI.exe -Recurse -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending|Select-Object -First 1
                    if(-not $installed){throw 'Installed WPAI.exe not found'}
                    $first=Start-Process $installed.FullName -PassThru; Start-Sleep 10; $first.Refresh(); if($first.HasExited){throw 'WPAI exited during startup'}
                    $second=Start-Process $installed.FullName -PassThru; Start-Sleep 5
                    $running=@(Get-CimInstance Win32_Process|Where-Object {$_.ExecutablePath-eq $installed.FullName})
                    if($running.Count-ne 1){throw "Single-instance failed $($running.Count)"}
                    $data=Join-Path $env:APPDATA 'com.wpai.desktop'; New-Item -ItemType Directory -Force $data|Out-Null
                    $marker=Join-Path $data 'uninstall-preserve-marker.txt'; Set-Content $marker 'preserve-user-data'
                    Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue; Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue
                    $uninstaller=Get-ChildItem $installed.DirectoryName -Filter 'uninstall*.exe'|Select-Object -First 1
                    if(-not $uninstaller){throw 'Uninstaller not found'}
                    $u=Start-Process $uninstaller.FullName -ArgumentList '/S' -PassThru -Wait; Start-Sleep 3
                    if($u.ExitCode-ne 0 -or (Test-Path $installed.FullName)){throw 'Uninstall failed'}
                    if(-not(Test-Path $marker)){throw 'Uninstall removed user data'}
                    [ordered]@{checkedAt=(Get-Date).ToUniversalTime().ToString('o');installerName=$installer.Name;installerBytes=$installer.Length;installerSha256=$hash;authenticodeStatus=$signature;installedExe=$installed.FullName;firstInstanceAlive=$true;processCountAfterSecondLaunch=$running.Count;uninstallExitCode=$u.ExitCode;userDataPreserved=$true;headSha='${{ github.sha }}'}|ConvertTo-Json|Set-Content -Encoding utf8 windows-smoke.json
                - uses: actions/upload-artifact@v4
                  with:
                    name: WPAI-Windows-Setup-${{ github.sha }}
                    path: |
                      src-tauri/target/release/bundle/nsis/*.exe
                      windows-smoke.json
                    if-no-files-found: error
                    retention-days: 30
          '@ | Set-Content -Encoding utf8 .github/workflows/windows-desktop.yml
      - name: Regenerate locked dependencies
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml
      - name: Commit applied changes
        shell: pwsh
        run: |
          Remove-Item .github/workflows/one-shot-spec500-hardening.yml -ErrorAction SilentlyContinue
          Remove-Item .github/workflows/one-shot-spec500-apply.yml
          git config user.name 'WPAI Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Apply native desktop and 500-item verification gates'
          git push origin HEAD:agent/wpai-production-rebuild
