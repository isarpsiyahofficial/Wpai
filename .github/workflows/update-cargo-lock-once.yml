name: Update WPAI Cargo Lock Once

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/update-cargo-lock-once.yml'

permissions:
  contents: write

jobs:
  update:
    if: ${{ github.event.pull_request.head.ref == 'agent/wpai-production-rebuild' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 0
      - name: Align and verify lockfile metadata
        run: |
          set -euo pipefail
          python scripts/update_cargo_lock_version.py
          python - <<'PY'
          from pathlib import Path
          lock = Path('src-tauri/Cargo.lock').read_text('utf-8')
          marker = '[[package]]\nname = "wpai-desktop"\nversion = "1.3.0"'
          if lock.count(marker) != 1:
              raise SystemExit('Cargo.lock WPAI root package is not exactly version 1.3.0')
          PY
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'WPAI Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src-tauri/Cargo.lock
          git diff --cached --check
          git commit -m 'align WPAI Cargo lock version'
          git push origin HEAD:agent/wpai-production-rebuild
