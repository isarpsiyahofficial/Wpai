name: WPAI Source Audit Export

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/source-audit-export.yml'

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.event.pull_request.head.ref == 'agent/wpai-production-rebuild' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wpai-production-rebuild
          fetch-depth: 1
      - name: Verify clean source tree
        run: |
          set -euo pipefail
          git status --short
          test -z "$(git status --short)"
      - name: Capture live production health
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 30 \
            -D live-health-headers.txt \
            https://wa-ai-panel.wa-ai-panel.workers.dev/health \
            -o live-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('live-health.json').read_text('utf-8'))
          if not value.get('ok'):
              raise SystemExit(f"Live health is not OK: {value}")
          required = ['worker', 'd1', 'r2Binding', 'queuesBinding', 'workersAiBinding', 'vectorizeBinding']
          components = value.get('components') or {}
          missing = [key for key in required if not components.get(key)]
          if missing:
              raise SystemExit(f"Live health missing components: {missing}; body={value}")
          print(json.dumps(value, ensure_ascii=False, indent=2))
          PY
      - name: Create audit source archive
        run: |
          set -euo pipefail
          git archive --format=zip --output=wpai-source-audit.zip HEAD
          sha256sum wpai-source-audit.zip > wpai-source-audit.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: WPAI-Source-Audit-${{ github.event.pull_request.head.sha }}
          path: |
            wpai-source-audit.zip
            wpai-source-audit.zip.sha256
            live-health.json
            live-health-headers.txt
          if-no-files-found: error
          retention-days: 3
