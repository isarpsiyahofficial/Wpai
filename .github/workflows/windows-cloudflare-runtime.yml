name: WPAI Windows Cloudflare Runtime

on:
  push:
    branches: [main, agent/wpai-production-rebuild]
    paths:
      - 'src-tauri/src/cloudflare.rs'
      - 'desktop-bootstrap/**'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-cloudflare-runtime.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpai-cloudflare-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-runtime:
    name: Installed Cloudflare engine and verbatim-path test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: x86_64-pc-windows-msvc
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --upgrade pip
          pip install -r sidecar/requirements.txt
      - name: Build required FAISS sidecar
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name faiss-service sidecar/faiss_service.py
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          Copy-Item dist/faiss-service.exe src-tauri/bin/faiss-service-x86_64-pc-windows-msvc.exe
      - name: Execute Windows Rust Cloudflare path tests
        shell: pwsh
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml cloudflare::tests -- --nocapture
      - name: Prepare packaged Cloudflare runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bootstrap = Join-Path $PWD 'desktop-bootstrap'
          $runtime = Join-Path $bootstrap 'runtime'
          $project = Join-Path $bootstrap 'project'
          Remove-Item $runtime, $project -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $runtime, $project | Out-Null

          $nodeExe = (Get-Command node).Source
          $nodeHome = Split-Path -Parent $nodeExe
          Copy-Item $nodeExe (Join-Path $runtime 'node.exe')
          New-Item -ItemType Directory -Force -Path (Join-Path $runtime 'node_modules') | Out-Null
          Copy-Item (Join-Path $nodeHome 'node_modules\npm') (Join-Path $runtime 'node_modules\npm') -Recurse

          $files = @('package.json','package-lock.json','wrangler.jsonc','index.html','vite.config.ts','tsconfig.base.json','tsconfig.frontend.json','tsconfig.worker.json','tsconfig.json')
          foreach ($file in $files) { Copy-Item (Join-Path $PWD $file) (Join-Path $project $file) }
          Copy-Item (Join-Path $PWD 'src') (Join-Path $project 'src') -Recurse
          Copy-Item (Join-Path $PWD 'migrations') (Join-Path $project 'migrations') -Recurse
      - name: Build and install NSIS package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm run desktop:build
          $installer = Get-ChildItem -Path src-tauri/target/release/bundle/nsis -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'NSIS setup.exe was not produced' }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS silent install failed: $($install.ExitCode)" }
      - name: Execute the installed packaged Node and bootstrap entrypoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $registryPaths = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty -Path $registryPaths -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'WPAI' } |
            Sort-Object InstallDate -Descending |
            Select-Object -First 1
          if (-not $entry) { throw 'WPAI registry entry was not found' }
          $installLocation = ([string]$entry.InstallLocation).Trim().Trim('"')
          if (-not (Test-Path $installLocation)) { throw "WPAI install location is missing: $installLocation" }

          $bootstrapScript = Get-ChildItem -Path $installLocation -Filter 'bootstrap.mjs' -File -Recurse | Select-Object -First 1
          $bootstrapNode = Get-ChildItem -Path $installLocation -Filter 'node.exe' -File -Recurse |
            Where-Object { $_.FullName -match 'cloudflare-bootstrap' } | Select-Object -First 1
          if (-not $bootstrapScript -or -not $bootstrapNode) { throw 'Installed Cloudflare engine resources are incomplete' }

          $payload = [ordered]@{
            action = 'invalid-runtime-self-test'
            accountId = 'ad8e99c82c6c17d823f6877ff1efade4'
            apiToken = ('a' * 48)
          } | ConvertTo-Json -Compress

          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo.FileName = $bootstrapNode.FullName
          $process.StartInfo.ArgumentList.Add($bootstrapScript.FullName)
          $process.StartInfo.WorkingDirectory = $bootstrapScript.Directory.FullName
          $process.StartInfo.UseShellExecute = $false
          $process.StartInfo.CreateNoWindow = $true
          $process.StartInfo.RedirectStandardInput = $true
          $process.StartInfo.RedirectStandardOutput = $true
          $process.StartInfo.RedirectStandardError = $true
          if (-not $process.Start()) { throw 'Installed Cloudflare Node process did not start' }
          $process.StandardInput.Write($payload)
          $process.StandardInput.Close()
          $stdout = $process.StandardOutput.ReadToEnd()
          $stderr = $process.StandardError.ReadToEnd()
          $process.WaitForExit()

          if ($stderr -match 'EISDIR|lstat') { throw "Packaged Node path resolution failed: $stderr" }
          if ([string]::IsNullOrWhiteSpace($stdout)) { throw "Installed Cloudflare engine returned no JSON. stderr=$stderr" }
          try { $result = $stdout | ConvertFrom-Json } catch { throw "Installed Cloudflare engine JSON could not be parsed. stdout=$stdout stderr=$stderr" }
          if ($result.ok -ne $false) { throw "Invalid-action self-test unexpectedly succeeded: $stdout" }
          if ([string]$result.error -notmatch 'Geçersiz Cloudflare bağlantı işlemi') {
            throw "Installed Cloudflare engine returned the wrong diagnostic: $stdout stderr=$stderr"
          }

          [ordered]@{
            checkedAt = (Get-Date).ToUniversalTime().ToString('o')
            installLocation = $installLocation
            bootstrapNode = $bootstrapNode.FullName
            bootstrapScript = $bootstrapScript.FullName
            nodeVersion = (& $bootstrapNode.FullName --version)
            processExitCode = $process.ExitCode
            jsonParsed = $true
            expectedDiagnostic = [string]$result.error
            eisdirAbsent = ($stderr -notmatch 'EISDIR|lstat')
            rustVerbatimPathTest = $true
            headSha = '${{ github.sha }}'
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 windows-cloudflare-runtime.json
          Get-Content windows-cloudflare-runtime.json
      - name: Uninstall test package
        if: always()
        shell: pwsh
        run: |
          $registryPaths = @(
            'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
          )
          $entry = Get-ItemProperty -Path $registryPaths -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq 'WPAI' } |
            Sort-Object InstallDate -Descending |
            Select-Object -First 1
          if ($entry) {
            $text = [string]$entry.UninstallString
            $path = if ($text -match '^"([^"]+\.exe)"') { $Matches[1] } elseif ($text -match '^([^\s]+\.exe)') { $Matches[1] } else { $null }
            if ($path -and (Test-Path $path)) { Start-Process -FilePath $path -ArgumentList '/S' -Wait }
          }
      - name: Upload Cloudflare runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: WPAI-Windows-Cloudflare-Runtime-${{ github.sha }}
          path: windows-cloudflare-runtime.json
          if-no-files-found: error
          retention-days: 30
